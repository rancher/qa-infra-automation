# Default configuration for the rancher-charts bastion mirror.
# Override these in inventory/group_vars/all.yml or via --extra-vars.

# Opt-in gate. Default off so ordinary airgap runs are unaffected.
enable_charts_mirror: false

# Upstream repository to mirror (Rancher's official charts git service).
charts_mirror_src: "https://git.rancher.io/charts"

# Branch to mirror. Rancher's catalog resolves charts from the release branch
# matching the deployed Rancher minor (e.g. Rancher v2.15 -> release-v2.15).
# Only this branch is fetched: a full all-branch mirror is multi-GB of history
# the catalog never serves. The branch carries every chart and every version
# published for that release line, which is what the monitoring/alerting
# validation suites need (chart present + at least two versions for the
# upgrade-path tests).
charts_mirror_branch: "{{ 'release-v' ~ (rancher_image_tag | default('v2.15.0') | regex_replace('^v(\\d+\\.\\d+).*', '\\1')) }}"

# Determinism against same-day upstream publishes: current Rancher releases
# lag one publish cycle before recently committed chart revisions show up in
# the cluster-scoped catalog index, so installing "latest" right after an
# upstream publish fails ("no chart version found"). Serve a settled ref —
# the previous commit that published content under charts_mirror_settled_path
# — which consumers (the ClusterRepo) clone. Set charts_mirror_serve_settled
# to false to serve the live branch head.
charts_mirror_serve_settled: true
charts_mirror_settled_suffix: "-settled"
# Path inside the charts repo whose changes constitute a catalog publication;
# the settled ref is the last-but-one commit touching it (commit distance is
# NOT used — the branch history mixes in clean/infra/pages commits that never
# published anything).
charts_mirror_settled_path: "assets"

# Where to store the bare mirror on the bastion. The git smart-HTTP vhost roots
# at the parent directory, so the repo is served at /<basename> (i.e. /charts.git).
charts_mirror_dest: "/srv/git/charts.git"

# Serving. Defaults match the ui-plugin mirror vhost: when that vhost is
# already enabled on the bastion its Listen port and GIT_PROJECT_ROOT are
# reused (both mirrors live under /srv/git); otherwise this role installs an
# equivalent vhost of its own.
charts_mirror_listen: "0.0.0.0"
charts_mirror_port: 8080

# Hostname/IP used in the *published* mirror URL (what the Rancher catalog
# controller clones). Empty/unset => auto-detect the bastion's primary private
# IPv4, which is how airgap nodes reach the bastion without depending on VPC
# public-DNS resolution. Override to pin a DNS name or a different interface.
charts_mirror_host: ""

# Wall-clock bound (seconds) for the post-install smart-HTTP verification.
charts_mirror_verify_timeout: "120"

# Hard wall-clock bound (seconds) for the mirror fetch, applied via
# coreutils timeout. Generous by default: a cold single-branch fetch of the
# charts repo transfers hundreds of MB over a bastion link.
charts_mirror_fetch_timeout: "3600"

# ClusterRepo whose gitRepo the deploy playbook repoints at the mirror.
# rancher-charts is the repo the monitoring/alerting suites resolve their
# charts from (catalog.RancherChartRepo in rancher/tests).
charts_mirror_clusterrepo: "rancher-charts"
