---
# Default variables for rke2_install role

# RKE2 version to install (leave empty for latest stable)
rke2_version: ""

# Installation method: online or airgap
rke2_install_method: online
# Installer method (rpm|tar) forwarded to the upstream script; empty = script default.
rke2_installer_method: ""

# RKE2 install script URL. get.rke2.io serves the current install.sh regardless of
# rke2_version, which is what the official install flow uses (INSTALL_RKE2_VERSION pins the product).
rke2_install_script_url: https://get.rke2.io

# Opt-in: download install.sh from the rke2_version git tag instead. Off by default because
# older tags lack newer OS mappings (e.g. SL Micro 6.2 -> slemicro rpm repo, rancher/rke2#9723).
rke2_install_script_pinned: false
rke2_install_script_versioned_url: "https://raw.githubusercontent.com/rancher/rke2/{{ rke2_version }}/install.sh"

# RKE2 channel (stable, latest, testing)
rke2_channel: stable

# Installation directory
rke2_bin_dir: /usr/local/bin

# RKE2 data directory
rke2_data_dir: /var/lib/rancher/rke2

# Airgap installation variables
rke2_airgap_tarball: ""
rke2_airgap_images_tarball: ""
rke2_airgap_install_script: ""

# Whether to start and enable RKE2 service after installation
rke2_start_on_boot: true
rke2_start_after_install: false  # Let rke2_cluster role handle starting

# Install rke2-selinux before RKE2 starts on SELinux-enabled SUSE hosts during
# online installs, matching the RedHat-family behavior of the official installer.
# Airgap installs never contact the configured RPM site; preinstall/bundle the
# policy package when it is required in an offline environment.
rke2_install_selinux_policy: true
rke2_selinux_rpm_site: "rpm.rancher.io"
rke2_selinux_testing_rpm_site: "rpm-testing.rancher.io"
