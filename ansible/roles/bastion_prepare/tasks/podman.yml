---
- name: Install Podman on SUSE/openSUSE systems
  ansible.builtin.zypper:
    name: podman
    state: present
  when: ansible_facts['os_family'] == 'Suse'

- name: Install Podman on Debian/Ubuntu systems
  ansible.builtin.apt:
    name: podman
    state: present
    update_cache: yes
  when: ansible_facts['os_family'] == 'Debian'

- name: Install Podman on RedHat/CentOS/Fedora systems
  ansible.builtin.package:
    name: podman
    state: present
  when: ansible_facts['os_family'] == 'RedHat'