---
# Main tasks for rke2_config role
# Configures RKE2 by generating config.yaml

- name: Display node configuration info
  ansible.builtin.debug:
    msg: "Configuring RKE2 on {{ inventory_hostname }} (Role: {{ node_type }}, Node roles: {{ node_roles }})"

- name: Gather existing services before configuring RKE2
  ansible.builtin.service_facts:
  become: true
  when: rke2_installed is not defined

- name: Ensure RKE2 config directory exists
  ansible.builtin.file:
    path: "{{ rke2_config_dir }}"
    state: directory
    mode: '0755'
    owner: root
    group: root
  become: true

# Extra-vars outrank set_fact, so precedence is resolved into NEW internal
# vars instead of mutating rke2_additional_config/rke2_cni in place.
- name: Resolve effective CNI and additional config
  ansible.builtin.set_fact:
    # Additional/server config overrides the historical Calico default;
    # other explicit CNIs retain their existing precedence.
    _rke2_effective_cni: >-
      {{ (rke2_cni | default(''))
         if ((rke2_cni | default('')) not in ['', 'calico'])
         else (((rke2_additional_config | default({})).cni | default('')) or
               ((rke2_server_config | default({})).cni | default('')) or
               (rke2_cni | default(''))) }}
    # cni is carried exclusively by _rke2_effective_cni: strip it from both
    # source dicts so the template can never render a duplicate key.
    _rke2_effective_additional_config: >-
      {{ rke2_additional_config | default({}) | dict2items |
         rejectattr('key', 'equalto', 'cni') | list | items2dict }}
    _rke2_effective_server_config: >-
      {{ rke2_server_config | default({}) | dict2items |
         rejectattr('key', 'equalto', 'cni') | list | items2dict }}

- name: Log CNI precedence
  ansible.builtin.debug:
    msg: >-
      Effective CNI '{{ _rke2_effective_cni }}'
      (rke2_cni='{{ rke2_cni | default('') }}', additional-config
      cni='{{ (rke2_additional_config | default({})).cni | default('') }}')
  when: "'cni' in (rke2_additional_config | default({}))"

- name: Check for existing RKE2 configuration
  ansible.builtin.stat:
    path: "{{ rke2_config_dir }}/config.yaml"
  register: rke2_config_previous
  become: true

# Cluster formation injects the join token after this role runs on new nodes.
# Preserve it on reruns so an existing node can restart before cluster formation.
- name: Read existing RKE2 join configuration
  ansible.builtin.slurp:
    src: "{{ rke2_config_dir }}/config.yaml"
  register: rke2_config_previous_content
  become: true
  no_log: true
  when:
    - rke2_config_previous.stat.exists
    - rke2_token is not defined
    - "'token' not in rke2_additional_config"
    - "'token' not in (rke2_server_config if rke2_config_service_name == 'rke2-server' else rke2_agent_config)"

- name: Validate existing RKE2 join configuration
  when: rke2_config_previous_content.content is defined
  block:
    - name: Parse existing RKE2 configuration without logging secrets
      ansible.builtin.set_fact:
        rke2_config_previous_data: "{{ rke2_config_previous_content.content | b64decode | from_yaml }}"
      no_log: true

    - name: Require an existing YAML mapping or empty configuration
      ansible.builtin.assert:
        that: rke2_config_previous_data is none or rke2_config_previous_data is mapping
        quiet: true
      no_log: true
  rescue:
    - name: Report invalid existing RKE2 configuration
      ansible.builtin.fail:
        msg: >-
          Existing RKE2 config.yaml is not a valid YAML mapping at {{ rke2_config_dir }}/config.yaml.
          Repair the file before rerunning; its contents have not been logged or overwritten.

- name: Preserve the existing join token unless explicitly configured
  ansible.builtin.set_fact:
    rke2_config_existing_token: >-
      {{ (rke2_config_previous_data or {}).get('token', '')
         if rke2_config_previous_content.content is defined else '' }}
  no_log: true

- name: Generate RKE2 config.yaml
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ rke2_config_dir }}/config.yaml"
    mode: '0600'
    owner: root
    group: root
  become: true
  notify: restart rke2

- name: Ensure RKE2 config.yaml.d drop-in directory exists
  ansible.builtin.file:
    path: "{{ rke2_config_dir }}/config.yaml.d"
    state: directory
    mode: '0755'
    owner: root
    group: root
  become: true

# RKE2 merges config.yaml.d/*.yaml with config.yaml; DTF report reads this drop-in to classify nodes.
- name: Generate RKE2 role_config.yaml drop-in
  ansible.builtin.template:
    src: role_config.yaml.j2
    dest: "{{ rke2_config_dir }}/config.yaml.d/role_config.yaml"
    mode: '0600'
    owner: root
    group: root
  become: true
  notify: restart rke2

# Opt-in CNI tuning. Must land before the server's first start: RKE2 only
# auto-applies what is already in the manifests dir when it comes up.
- name: Apply CNI HelmChartConfig
  when:
    - rke2_cni_values_content | length > 0
    - node_type in ['master', 'server'] or 'cp' in node_roles or 'etcd' in node_roles
  block:
    - name: Ensure RKE2 server manifests directory exists
      ansible.builtin.file:
        path: "{{ rke2_manifests_dir }}"
        state: directory
        mode: '0755'
        owner: root
        group: root
      become: true

    - name: Generate CNI HelmChartConfig manifest
      ansible.builtin.template:
        src: cni_helmchartconfig.yaml.j2
        dest: "{{ rke2_manifests_dir }}/rke2-{{ rke2_cni }}-config.yaml"
        mode: '0644'
        owner: root
        group: root
      become: true
      notify: restart rke2

- name: Display config file location
  ansible.builtin.debug:
    msg: "RKE2 configuration written to {{ rke2_config_dir }}/config.yaml"
