---
# Default variables for rke2_config role

# RKE2 configuration directory
rke2_config_dir: /etc/rancher/rke2

# RKE2 token file (for joining nodes)
rke2_token_file: "{{ rke2_config_dir }}/token"

# CNI written into config.yaml. Direct role consumers keep the historical
# calico default; the shared playbook passes '' (no cni key -> RKE2 default).
rke2_cni: calico

# Directory RKE2 servers auto-apply manifests from on first start
rke2_manifests_dir: /var/lib/rancher/rke2/server/manifests

# Opt-in HelmChartConfig valuesContent for the bundled CNI chart, as a YAML
# string. Empty means "use the chart defaults", which is what mixed
# Linux/Windows clusters want: rke2-calico already ships bgp: Disabled,
# encapsulation: VXLAN and strictAffinity: true. Set this only to tune MTU,
# pod CIDRs, or the VXLAN adapter. Applied on servers before first start -
# RKE2 only auto-applies manifests it finds at startup.
rke2_cni_values_content: ""

# Default RKE2 configuration for server nodes
rke2_server_config:
  tls-san:
    - "{{ fqdn }}"
    - "{{ kube_api_host }}"
  write-kubeconfig-mode: "0644"

# Default RKE2 configuration for agent nodes
rke2_agent_config:
  server: "https://{{ kube_api_host }}:9345"

# Whether to disable default components
rke2_disable_components: []
# Example: ["rke2-ingress-nginx", "rke2-metrics-server"]

# Additional configuration options (merged into config)
rke2_additional_config: {}
