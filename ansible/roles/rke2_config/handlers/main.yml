---
# Handlers for rke2_config role

- name: restart rke2
  ansible.builtin.systemd:
    name: "{{ rke2_config_service_name }}"
    state: restarted
  become: true
  when: >-
    rke2_installed | default(
      (ansible_facts.services | default({})).get(rke2_config_service_name ~ '.service', {}).get('status', 'not-found') != 'not-found' and
      (ansible_facts.services | default({})).get(rke2_config_service_name ~ '.service', {}).get('state', '') == 'running'
    ) | bool
  listen: restart rke2
