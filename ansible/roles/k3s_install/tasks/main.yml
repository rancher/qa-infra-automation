---
- name: Validate input parameters
  assert:
    that:
      - kubernetes_version is regex('^[a-zA-Z0-9.+_-]+$')
      - k3s_channel is match("^(stable|testing|latest|v\\d+(\\.\\d+){0,2})$")  
    fail_msg: "Invalid k3s_channel '{{ k3s_channel }}'. Must be stable, testing, latest, or v1[.x][.y]"

- name: Create K3s directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0700'
  loop:
    - /etc/rancher/k3s
    - "{{ k3s_server_dir | default('/var/lib/rancher/k3s/server') }}/logs"

- name: Create hardening supporting directories only if hardening is enabled
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0700'
  loop:
    - "{{ k3s_server_dir | default('/var/lib/rancher/k3s/server') }}"

- name: Install k3s-selinux policy on RHEL-family hosts
  ansible.builtin.shell: |
    set -euo pipefail

    if rpm -q k3s-selinux >/dev/null 2>&1; then
      echo "k3s-selinux already installed"
      exit 0
    fi

    el="$(rpm -E %rhel 2>/dev/null || true)"
    if [ -z "${el}" ] || [ "${el}" = "%rhel" ]; then
      echo "not an EL rpm target; skipping"
      exit 0
    fi

    # rpm.rancher.io only publishes centos/7..9; clamp newer majors to 9 the
    # same way the k3s install.sh does (RHEL 10 otherwise 404s and loses selinux).
    if [ "${el}" -gt 9 ] 2>/dev/null; then
      el=9
    fi

    if command -v dnf >/dev/null 2>&1; then
      package_manager=dnf
    elif command -v yum >/dev/null 2>&1; then
      package_manager=yum
    else
      echo "no dnf/yum available; skipping"
      exit 0
    fi

    "${package_manager}" install -y \
      --nogpgcheck \
      --repofrompath="rancher-k3s,https://rpm.rancher.io/k3s/stable/common/centos/${el}/noarch/" \
      k3s-selinux
  args:
    executable: /bin/bash
  register: k3s_selinux_policy_install
  changed_when:
    - k3s_selinux_policy_install.rc == 0
    - "'k3s-selinux already installed' not in k3s_selinux_policy_install.stdout"
    - "'skipping' not in k3s_selinux_policy_install.stdout"
  failed_when: false
  when:
    - k3s_install_selinux_policy | default(true) | bool
    - ansible_facts.os_family | default('') == "RedHat"

- name: Warn when k3s-selinux policy installation fails
  ansible.builtin.debug:
    msg: >-
      k3s-selinux installation failed on {{ inventory_hostname }}.
      Local-path-provisioner storage tests may fail. rc={{ k3s_selinux_policy_install.rc }}
      stdout={{ k3s_selinux_policy_install.stdout | default('') }}
      stderr={{ k3s_selinux_policy_install.stderr | default('') }}
  when:
    - k3s_selinux_policy_install is defined
    - k3s_selinux_policy_install.rc is defined
    - k3s_selinux_policy_install.rc != 0

- name: Probe SELinux state on SUSE
  ansible.builtin.command: getenforce
  register: k3s_suse_getenforce
  changed_when: false
  failed_when: false
  when:
    - k3s_install_selinux_policy | default(true) | bool
    - ansible_facts.os_family | default('') == "Suse"

- name: Ensure a valid k3s-selinux policy on SUSE
  when:
    - k3s_install_selinux_policy | default(true) | bool
    - ansible_facts.os_family | default('') == "Suse"
    - (k3s_suse_getenforce.stdout | default('')) in ['Enforcing', 'Permissive']
  block:
    - name: Read SUSE OS release metadata
      ansible.builtin.slurp:
        src: /etc/os-release
      register: k3s_suse_os_release_file

    - name: Resolve SUSE k3s-selinux repository
      ansible.builtin.set_fact:
        k3s_selinux_rpm_channel: >-
          {{ 'testing' if 'testing' in k3s_channel else
             'latest' if 'latest' in k3s_channel else 'stable' }}
        k3s_selinux_resolved_rpm_site: >-
          {{ k3s_selinux_testing_rpm_site if 'testing' in k3s_channel else
             k3s_selinux_rpm_site }}
        k3s_selinux_rpm_variant: >-
          {{ 'slemicro' if
             ((ansible_facts.distribution | default('') | lower == 'sles' and
               ansible_facts.distribution_major_version | default('0') | int >= 16) or
              (((k3s_suse_os_release_file.content | b64decode) |
                regex_search('(?m)^(ID|VARIANT_ID)="?(sle-micro|sl-micro|sle-micro-rancher|transactional)"?$'))
               is not none)) else 'microos' }}

    - name: Gather installed package facts on SUSE
      ansible.builtin.package_facts:
        manager: auto

    - name: Read loaded SELinux modules on SUSE
      ansible.builtin.command: semodule -l
      register: k3s_selinux_suse_modules
      changed_when: false
      failed_when: false

    - name: Check whether the SUSE k3s-selinux policy is ready
      ansible.builtin.set_fact:
        k3s_selinux_suse_ready: >-
          {{ 'k3s-selinux' in ansible_facts.packages and
             (k3s_selinux_suse_modules.stdout_lines |
              select('match', '^k3s(?:\\s|$)') | list | length > 0) }}

    - name: Install a valid k3s-selinux policy on SUSE
      when: not k3s_selinux_suse_ready | bool
      block:
        # SLE Micro installs land in a new snapshot: zypper/rpm_key against the
        # running system are wrong there — use transactional-update + reboot.
        - name: Detect a transactional-update host
          ansible.builtin.stat:
            path: /usr/sbin/transactional-update
          register: k3s_suse_transactional

        - name: Remove an installed but unloaded k3s-selinux policy
          community.general.zypper:
            name: k3s-selinux
            state: absent
          when:
            - "'k3s-selinux' in ansible_facts.packages"
            - not k3s_suse_transactional.stat.exists

        - name: Find existing Rancher K3s repositories
          ansible.builtin.find:
            paths: /etc/zypp/repos.d
            patterns: "rancher-k3s-common*.repo"
            file_type: file
          register: k3s_selinux_suse_repositories

        - name: Remove existing Rancher K3s repositories
          ansible.builtin.file:
            path: "{{ item.path }}"
            state: absent
          loop: "{{ k3s_selinux_suse_repositories.files }}"
          loop_control:
            label: "{{ item.path }}"

        - name: Ensure the SELinux RPM state directory exists
          ansible.builtin.file:
            path: /var/lib/rpm-state
            state: directory
            mode: "0755"
          when: not k3s_suse_transactional.stat.exists

        - name: Import the Rancher K3s RPM signing key
          ansible.builtin.rpm_key:
            key: "https://{{ k3s_selinux_resolved_rpm_site }}/public.key"
            state: present
          when: not k3s_suse_transactional.stat.exists

        - name: Configure the Rancher K3s repository
          ansible.builtin.copy:
            dest: /etc/zypp/repos.d/rancher-k3s-common.repo
            mode: "0644"
            content: |
              [rancher-k3s-common-{{ k3s_selinux_rpm_channel }}]
              name=Rancher K3s Common ({{ k3s_selinux_rpm_channel }})
              baseurl=https://{{ k3s_selinux_resolved_rpm_site }}/k3s/{{ k3s_selinux_rpm_channel }}/common/{{ k3s_selinux_rpm_variant }}/noarch
              enabled=1
              gpgcheck=1
              repo_gpgcheck=0
              gpgkey=https://{{ k3s_selinux_resolved_rpm_site }}/public.key

        - name: Install k3s-selinux from the Rancher repository
          community.general.zypper:
            name: k3s-selinux
            state: present
            update_cache: true
          when: not k3s_suse_transactional.stat.exists

        # rpm-state must exist inside the SAME snapshot the rpm installs into
        # (the SELinux macro needs it), so it is created within the transaction.
        - name: Install k3s-selinux via transactional-update (SLE Micro)
          ansible.builtin.command:
            cmd: >-
              transactional-update --no-selfupdate -d -n run sh -c
              'mkdir -p /var/lib/rpm-state;
              rpm -q k3s-selinux >/dev/null 2>&1 && zypper -n remove k3s-selinux;
              zypper -n --gpg-auto-import-keys install k3s-selinux'
          when: k3s_suse_transactional.stat.exists
          register: k3s_selinux_suse_tu_install
          changed_when: k3s_selinux_suse_tu_install.rc == 0
          # SLE Micro's own update timer can hold the transactional lock at boot.
          retries: 5
          delay: 30
          until: k3s_selinux_suse_tu_install.rc == 0

        - name: Reboot to activate the transactional snapshot
          ansible.builtin.reboot:
            reboot_timeout: 600
            # sshd accepts logins before /home mounts on SLE Micro boots; check
            # the SSH user's home explicitly — under become, $HOME is /root.
            test_command: >-
              test -d "$(getent passwd {{ ansible_user | quote }} | cut -d: -f6)"
          when: k3s_suse_transactional.stat.exists

    - name: Refresh installed package facts on SUSE
      ansible.builtin.package_facts:
        manager: auto

    - name: Check the installed SUSE k3s-selinux policy file
      ansible.builtin.stat:
        path: /usr/share/selinux/packages/k3s.pp
      register: k3s_selinux_suse_policy

    - name: Check loaded SELinux modules after SUSE installation
      ansible.builtin.command: semodule -l
      register: k3s_selinux_suse_modules_after
      changed_when: false
      failed_when: false

    - name: Resolve SUSE k3s-selinux verification state
      ansible.builtin.set_fact:
        k3s_selinux_suse_installed: "{{ 'k3s-selinux' in ansible_facts.packages }}"
        k3s_selinux_suse_policy_exists: "{{ k3s_selinux_suse_policy.stat.exists | default(false) }}"
        k3s_selinux_suse_module_loaded: >-
          {{ k3s_selinux_suse_modules_after.stdout_lines | default([]) |
             select('match', '^k3s(?:\\s|$)') | list | length > 0 }}
        k3s_selinux_suse_expected_repo: >-
          {{ 'https://' ~ k3s_selinux_resolved_rpm_site ~ '/k3s/' ~
             k3s_selinux_rpm_channel ~ '/common/' ~
             k3s_selinux_rpm_variant ~ '/noarch' }}

    - name: Verify the SUSE k3s-selinux policy
      ansible.builtin.assert:
        that:
          - k3s_selinux_suse_installed | bool
          - k3s_selinux_suse_policy_exists | bool
          - k3s_selinux_suse_module_loaded | bool
        fail_msg: >-
          SUSE k3s-selinux verification failed:
          installed={{ k3s_selinux_suse_installed }},
          policy_file_exists={{ k3s_selinux_suse_policy_exists }},
          module_loaded={{ k3s_selinux_suse_module_loaded }},
          semodule_rc={{ k3s_selinux_suse_modules_after.rc | default('unavailable') }},
          expected_repo={{ k3s_selinux_suse_expected_repo }}

    # SLE Micro AMIs may pre-create /var/lib/rancher with generic labels; fix the
    # types without -F so existing MCS ranges survive re-runs on live clusters.
    - name: Restore SELinux contexts under /var/lib/rancher
      ansible.builtin.shell: |
        [ -d /var/lib/rancher ] || exit 0
        restorecon -Rv /var/lib/rancher
      register: k3s_selinux_suse_relabel
      changed_when: k3s_selinux_suse_relabel.stdout | default('') | length > 0

- name: Generate K3s configuration from template
  template:
    src: k3s-config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: '0644'
    backup: true

- name: Check if k3s_registry.yaml exists in role files
  ansible.builtin.stat:
    path: "{{ role_path }}/files/k3s_registry.yaml"
  register: registry_file

- name: Ensure destination directory for registry exists
  ansible.builtin.file:
    path: /etc/rancher/k3s/
    state: directory
    mode: '0700'
  when: registry_file.stat.exists

- name: Copy k3s_registry.yaml to the registry filepath
  ansible.builtin.copy:
    src: "{{ role_path }}/files/k3s_registry.yaml"
    mode: '0644'
    dest: /etc/rancher/k3s/registries.yaml
  when: registry_file.stat.exists

- name: Detect if version is a commit hash
  ansible.builtin.set_fact:
    _k3s_is_commit: "{{ kubernetes_version is match('^[0-9a-f]{40}$') }}"

# --- Version tag: verified binary download (B1 pattern) ---
- name: Install K3s from version tag with checksum verification
  when: not _k3s_is_commit
  block:
    # k3s publishes per-arch artifacts: "k3s"/sha256sum-amd64.txt on x86_64,
    # "k3s-arm64"/sha256sum-arm64.txt on aarch64 (amd64-only URL = Exec format error on ARM).
    - name: Resolve K3s artifact names for the node architecture
      ansible.builtin.set_fact:
        _k3s_arch: "{{ 'arm64' if ansible_facts.architecture == 'aarch64' else 'amd64' }}"

    - name: Download K3s binary with SHA256 verification
      include_role:
        name: download_verify
      vars:
        dv_artifact_url: "{{ k3s_github_release_url }}/{{ kubernetes_version }}/k3s{{ '-arm64' if _k3s_arch == 'arm64' else '' }}"
        dv_checksum_url: "{{ k3s_github_release_url }}/{{ kubernetes_version }}/sha256sum-{{ _k3s_arch }}.txt"
        dv_dest: "{{ k3s_bin_dir }}/k3s"
        dv_checksum_format: "github_sha256sum"
        dv_github_artifact_name: "k3s{{ '-arm64' if _k3s_arch == 'arm64' else '' }}"
        dv_mode: "0755"

    - name: Create k3s utility symlinks
      ansible.builtin.file:
        src: "{{ k3s_bin_dir }}/k3s"
        dest: "{{ k3s_bin_dir }}/{{ item }}"
        state: link
        force: true
      loop:
        - kubectl
        - crictl
        - ctr

    # The later install script runs with INSTALL_K3S_SKIP_DOWNLOAD=true, which
    # also skips upstream's chcon — a pre-placed binary would stay mislabeled.
    - name: Restore the SELinux context on the K3s binary
      ansible.builtin.shell: |
        command -v restorecon >/dev/null 2>&1 || exit 0
        restorecon -v {{ k3s_bin_dir }}/k3s
      register: _k3s_binary_relabel
      changed_when: _k3s_binary_relabel.stdout | default('') | length > 0

    - name: Read the K3s binary SELinux context on SUSE
      ansible.builtin.command:
        cmd: stat -c %C {{ k3s_bin_dir }}/k3s
      register: _k3s_binary_selinux_ctx
      changed_when: false
      when: k3s_selinux_suse_module_loaded | default(false) | bool

    - name: Verify the K3s binary SELinux label on SUSE
      ansible.builtin.assert:
        that:
          - "'container_runtime_exec_t' in _k3s_binary_selinux_ctx.stdout"
        fail_msg: >-
          K3s binary at {{ k3s_bin_dir }}/k3s is mislabeled:
          {{ _k3s_binary_selinux_ctx.stdout | default('unknown') }}
      when: k3s_selinux_suse_module_loaded | default(false) | bool

    # curl | sh hides curl failures (empty input exits 0), so download the
    # script with its own retries and execute it as a separate step.
    - name: Download the K3s install script
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /tmp/k3s-install.sh
        mode: '0755'
      register: _k3s_script_download
      retries: 3
      delay: 15
      until: _k3s_script_download is succeeded

    - name: Register K3s systemd service via install script
      ansible.builtin.shell: |
        export INSTALL_K3S_SKIP_DOWNLOAD="true"
        export INSTALL_K3S_SKIP_START="true"
        export INSTALL_K3S_VERSION="{{ kubernetes_version }}"
        {% if k3s_node_type == 'agent' %}
        export INSTALL_K3S_EXEC="agent"
        {% endif %}
        sh /tmp/k3s-install.sh
      register: _k3s_service_register
      changed_when: true

    - name: Remove the K3s install script
      ansible.builtin.file:
        path: /tmp/k3s-install.sh
        state: absent

# --- Commit hash: fallback to install script (requires GITHUB_TOKEN) ---
- name: Check if k3s binary already exists
  when: _k3s_is_commit
  ansible.builtin.stat:
    path: "{{ k3s_bin_dir }}/k3s"
  register: _k3s_binary

- name: Install K3s from commit hash via install script
  when:
    - _k3s_is_commit
    - not _k3s_binary.stat.exists
  block:
    - name: Warn about commit hash install security
      ansible.builtin.debug:
        msg: >-
          Commit hash installs use the upstream install script (requires GITHUB_TOKEN).
          For full checksum verification, prefer a version tag instead.

    - name: Download the K3s install script
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /tmp/k3s-install.sh
        mode: '0755'
      register: _k3s_commit_script_download
      retries: 3
      delay: 15
      until: _k3s_commit_script_download is succeeded

    - name: Install K3s via install script
      ansible.builtin.shell: |
        export INSTALL_K3S_COMMIT="{{ kubernetes_version }}"
        export INSTALL_K3S_SKIP_START="true"
        {% if k3s_node_type == 'agent' %}
        export INSTALL_K3S_EXEC="agent"
        {% endif %}
        sh /tmp/k3s-install.sh
      register: _k3s_commit_install_result
      changed_when: true
      retries: 3
      delay: 20
      until: _k3s_commit_install_result.rc == 0

    - name: Remove the K3s install script
      ansible.builtin.file:
        path: /tmp/k3s-install.sh
        state: absent

# --- Systemd service ---
- name: Enable and start K3s service
  block:
    - name: Enable and start K3s service
      systemd:
        name: "{{ 'k3s-agent' if k3s_node_type == 'agent' else 'k3s' }}"
        state: "{{ k3s_service_state | default('started') }}"
        enabled: "{{ k3s_service_enabled | default(true) }}"
        daemon_reload: true

    - name: Wait for K3s service to be ready
      wait_for:
        port: "{{ 6443 if k3s_node_type in ['cluster-init', 'server'] else 10250 }}"
        host: "127.0.0.1"
        timeout: 300
      when: (k3s_service_state | default('started')) == 'started'

  rescue:
    - name: Display K3s debugging information
      debug:
        msg: |
          K3s Service Debugging Information:
          Service: {{ 'k3s-agent' if k3s_node_type == 'agent' else 'k3s' }}
          Status: {{ ansible_facts.services[('k3s-agent' if k3s_node_type == 'agent' else 'k3s')].state | default('unknown') }}
          
    - name: Verify K3s service health
      systemd:
        name: "{{ 'k3s' if k3s_node_type != 'agent' else 'k3s-agent' }}"
      register: service_status

    - name: Get service logs
      shell: journalctl -u {{ 'k3s-agent' if k3s_node_type == 'agent' else 'k3s' }} --no-pager -n 50
      register: service_logs
      
    - name: Display service logs
      debug:
        var: service_logs.stdout_lines
        
    - name: Fail with detailed error information
      fail:
        msg: |
          K3s service failed to start.
          Service: {{ 'k3s-agent' if k3s_node_type == 'agent' else 'k3s' }}
          Status: {{ service_status.status.ActiveState | default('unknown') }}

- name: Set kubeconfig server address (cluster-init only)
  lineinfile:
    path: /etc/rancher/k3s/k3s.yaml
    regexp: '^\s*server:\s*.*$'
    line: "    server: https://{{ k3s_fqdn | default(k3s_api_host, true) }}:6443"
    backrefs: false
  when:
    - k3s_node_type == 'cluster-init'

- name: Check if K3s PKI directory exists
  stat:
    path: "{{ k3s_server_dir | default('/var/lib/rancher/k3s/server') }}/tls"
  register: k3s_pki_dir
  when: k3s_node_type in ['cluster-init', 'server']

- name: Restrict K3s PKI certificates to 600 only if hardening is enabled (CIS 1.1.20)
  file:
    path: "{{ item }}"
    mode: '0600'
  with_fileglob:
    - "{{ k3s_server_dir | default('/var/lib/rancher/k3s/server') }}/tls/*.crt"
    - "{{ k3s_server_dir | default('/var/lib/rancher/k3s/server') }}/tls/*.key"
  when:
    - k3s_node_type in ['cluster-init', 'server']
    - k3s_pki_dir.stat.exists | default(false)

- name: Check K3s installation
  command: "{{ k3s_bin_dir }}/k3s --version"
  register: k3s_version_output
  changed_when: false
  failed_when: k3s_version_output.rc != 0

- name: Show K3s installation success
  debug:
    msg: |
      Version: {{ k3s_version_output.stdout.split('\n')[0] }}
      Node Type: {{ k3s_node_type }}
      Service: {{ 'k3s-agent' if k3s_node_type == 'agent' else 'k3s' }}
