---
# K3s install role defaults

# GitHub release base URL for K3s binaries and checksums
k3s_github_release_url: "https://github.com/k3s-io/k3s/releases/download"

# K3s channel for version resolution (stable, latest, testing)
k3s_channel: "latest"

# K3s channel URL for resolving channel to version
k3s_channel_url: "https://update.k3s.io/v1-release/channels"

# Binary install directory
k3s_bin_dir: "/usr/local/bin"

# Commit installs download GitHub Actions artifacts, which need a token with read access to k3s-io/k3s.
k3s_github_token: "{{ lookup('env', 'GITHUB_TOKEN') }}"

# Install k3s-selinux before K3s starts, matching the get.k3s.io behavior
# bypassed by this role's direct binary install path.
k3s_install_selinux_policy: true
k3s_selinux_rpm_site: "rpm.rancher.io"
k3s_selinux_testing_rpm_site: "rpm-testing.rancher.io"
