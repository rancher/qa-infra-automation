---
# Main tasks for rke2_setup role
# Prepares the system for RKE2 installation

- name: Display OS information
  ansible.builtin.debug:
    msg: "Detected OS: {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }} ({{ ansible_facts.os_family }})"

# SLES images often run cloud-init / wicked / auto-refresh holding /var/run/zypp.pid
# at first boot; SLE Micro's update timer holds the transactional-update lock too
# (the zypper module wraps calls in transactional-update on those hosts).
- name: Wait for zypper and transactional-update locks to clear (SLES/openSUSE)
  ansible.builtin.shell: |
    for i in $(seq 1 120); do
      busy=""
      for f in /var/run/zypp.pid /var/run/transactional-update.pid; do
        [ -f "$f" ] && pid=$(cat "$f" 2>/dev/null) || pid=""
        if [ -n "$pid" ] && kill -0 "$pid" 2>/dev/null; then busy="$f:$pid"; fi
      done
      [ -z "$busy" ] && exit 0
      sleep 5
    done
    echo "package lock still held ($busy) after 600s"; exit 1
  args: { executable: /bin/bash }
  changed_when: false
  when: ansible_facts.os_family == "Suse"
  become: true

- name: Install required packages (SLES/openSUSE)
  community.general.zypper:
    name: "{{ rke2_required_packages }}"
    state: present
  when: ansible_facts.os_family == "Suse"
  become: true
  register: zypper_install
  until: zypper_install is succeeded
  # The transactional-update lock can be held for minutes by the OS timer.
  retries: 20
  delay: 30

- name: Install required packages (RHEL/CentOS)
  ansible.builtin.yum:
    name: "{{ rke2_required_packages }}"
    state: present
  when: ansible_facts.os_family == "RedHat"
  become: true

- name: Install required packages (Debian/Ubuntu)
  ansible.builtin.apt:
    name: "{{ rke2_required_packages }}"
    state: present
    update_cache: true
  when: ansible_facts.os_family == "Debian"
  become: true

- name: Check cgroup version
  ansible.builtin.shell: |
    if [ -f /proc/filesystems ]; then
      grep -q cgroup2 /proc/filesystems && echo "v2" || echo "v1"
    else
      echo "unknown"
    fi
  register: cgroup_version
  changed_when: false

- name: Display cgroup version
  ansible.builtin.debug:
    msg: "Detected cgroup version: {{ cgroup_version.stdout }}"

- name: Fail if cgroup v1 is detected
  ansible.builtin.fail:
    msg: >
      RKE2 v1.35+ requires cgroup v2, but this host is running cgroup v1.
      To enable cgroup v2, add 'GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT systemd.unified_cgroup_hierarchy=1"'
      to /etc/default/grub, then run 'grub2-mkconfig -o /boot/grub2/grub.cfg' and reboot.
      Alternatively, use a SLES 15 SP5+ AMI which defaults to cgroup v2.
  when: cgroup_version.stdout == "v1"

- name: Display setup completion
  ansible.builtin.debug:
    msg: "System setup complete. Required packages installed. Firewall managed by cloud provider security groups."
