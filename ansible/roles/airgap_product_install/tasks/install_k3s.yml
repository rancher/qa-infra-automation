---
# Official install.sh in offline mode (INSTALL_K3S_SKIP_DOWNLOAD), binary staged first.
- name: Place the K3s binary
  ansible.builtin.copy:
    src: "{{ airgap_node_dir }}/k3s"
    dest: /usr/local/bin/k3s
    remote_src: true
    mode: "0755"
    owner: root
    group: root
  become: true

- name: Run the K3s installer (server)
  ansible.builtin.command:
    argv: [sh, "{{ airgap_node_dir }}/k3s-install.sh"]
  environment:
    INSTALL_K3S_SKIP_DOWNLOAD: "true"
    INSTALL_K3S_VERSION: "{{ kubernetes_version }}"
  become: true
  when: airgap_node_role == 'server'
  register: airgap_k3s_install
  changed_when: true

- name: Run the K3s installer (agent)
  ansible.builtin.command:
    argv: [sh, "{{ airgap_node_dir }}/k3s-install.sh"]
  environment:
    INSTALL_K3S_SKIP_DOWNLOAD: "true"
    INSTALL_K3S_VERSION: "{{ kubernetes_version }}"
    K3S_URL: "https://{{ airgap_master_ip }}:6443"
    K3S_TOKEN: "{{ airgap_join_token }}"
  become: true
  when: airgap_node_role == 'agent'
  register: airgap_k3s_agent_install
  changed_when: true
  no_log: true

- name: Wait for the K3s service to be active
  ansible.builtin.systemd:
    name: "{{ 'k3s' if airgap_node_role == 'server' else 'k3s-agent' }}"
    state: started
    enabled: true
  become: true
