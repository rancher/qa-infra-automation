[defaults]
inventory = inventory
# Chart selection filters live beside the playbook. Ansible finds them there
# implicitly, but only because the playbook is in this directory; naming the
# path makes the dependency visible and survives the playbook being invoked
# from somewhere else. Relative to the working directory, which is this
# directory both locally and in the runner image (WORKDIR /playbook).
filter_plugins = ./filter_plugins
localhost_warning = False
roles_path = ../../roles:/qa-infra/ansible/roles
fact_caching = memory
fact_caching_timeout = 3600
timeout = 30
connect_timeout = 30
host_key_checking = False
interpreter_python = auto_silent

[ssh_connection]
ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
pipelining = True
ControlMaster = auto
ControlPersist = 60s
ControlPath = /tmp/ansible-ssh-%h-%p-%r

[inventory]
enable_plugins = host_list, script, auto, yaml, ini, cloud.terraform.terraform_state
