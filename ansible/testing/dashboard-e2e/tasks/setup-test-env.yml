# Prepare the test environment: clone dashboard, copy CI files from the
# playbook's files/ directory, overlay dependency files from master onto
# release branches, create Rancher users, encode SSH keys for Cypress,
# build the Docker image, and generate the .env file.

- name: Wait for Dashboard UI
  ansible.builtin.uri:
    url: "https://{{ rancher_host }}/dashboard/auth/login"
    validate_certs: false
    status_code: 200
  register: dashboard_check
  until: dashboard_check.status == 200
  retries: 30
  delay: 10

- name: Validate local dashboard directory
  when: dashboard_src is defined
  block:
    - name: Stat local dashboard directory
      ansible.builtin.stat:
        path: "{{ dashboard_dir }}"
      register: _local_dashboard_stat

    - name: Assert local dashboard directory exists and is valid
      ansible.builtin.assert:
        that:
          - _local_dashboard_stat.stat.exists
          - _local_dashboard_stat.stat.isdir
        fail_msg: "dashboard_src directory '{{ host_dashboard_dir }}' does not exist or is not a directory."

    - name: Display local dashboard directory notice
      ansible.builtin.debug:
        msg: >-
          NOTICE: Using local dashboard directory '{{ host_dashboard_dir }}'.
          Git clone is skipped; dashboard_repo and dashboard_branch are ignored.
          Ensure your local code is compatible with rancher_helm_repo ('{{ rancher_helm_repo }}')
          and rancher_image_tag ('{{ rancher_image_tag }}').

- name: Detect dashboard target branch
  ansible.builtin.set_fact:
    target_branch: >-
      {%- if dashboard_branch is defined and dashboard_branch and dashboard_branch != 'master' -%}
        {{ dashboard_branch }}
      {%- elif rancher_image_tag == 'head' -%}
        master
      {%- elif rancher_image_tag is match('^v(\d+\.\d+)') -%}
        release-{{ rancher_image_tag | regex_replace('^v(\d+\.\d+).*$', '\1') }}
      {%- else -%}
        {{ dashboard_branch | default('master') }}
      {%- endif -%}
  when: dashboard_src is not defined

- name: Show detected branch
  ansible.builtin.debug:
    msg: "rancher_image_tag={{ rancher_image_tag }} → target_branch={{ target_branch }}"
  when: dashboard_src is not defined

- name: Remove old dashboard checkout
  ansible.builtin.file:
    path: "{{ dashboard_dir }}"
    state: absent
  when: dashboard_src is not defined

- name: Show clone target
  ansible.builtin.debug:
    msg: "Cloning {{ dashboard_repo }} @ {{ target_branch }}"
  when: dashboard_src is not defined

- name: Clone dashboard repo
  ansible.builtin.git:
    repo: "https://github.com/{{ dashboard_repo | regex_replace('\\.git$', '') }}.git"
    dest: "{{ dashboard_dir }}"
    version: "{{ target_branch }}"
    depth: 1
  retries: 3
  delay: 10
  register: _git_clone
  until: _git_clone is success
  when: dashboard_src is not defined

- name: Copy CI files from playbook into dashboard checkout
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ dashboard_dir }}/{{ item.dest }}"
    mode: "{{ item.mode | default('0644') }}"
  loop:
    - { src: "{{ playbook_dir }}/files/Dockerfile.ci", dest: "cypress/jenkins/Dockerfile.ci" }
    - { src: "{{ playbook_dir }}/files/cypress.sh", dest: "cypress/jenkins/cypress.sh", mode: "0755" }
    - { src: "{{ playbook_dir }}/files/utils.sh", dest: "cypress/jenkins/utils.sh", mode: "0755" }
    - { src: "{{ playbook_dir }}/files/grep-filter.ts", dest: "cypress/jenkins/grep-filter.ts" }
    - { src: "{{ playbook_dir }}/files/cypress.config.jenkins.ts", dest: "cypress/jenkins/cypress.config.jenkins.ts" }
  loop_control:
    label: "{{ item.dest }}"

# Dockerfile.ci copies one file, imported_config, and reads nothing else from
# the context. Building from the checkout would ship the whole working tree,
# including cypress/node_modules, and would need a .dockerignore written into a
# directory that is not ours to edit.
- name: Check the Docker build context path before resetting it
  ansible.builtin.assert:
    that:
      - docker_context_dir is defined
      - docker_context_dir | length > 0
      - docker_context_dir is search('/outputs/docker-context$')
    fail_msg: >-
      docker_context_dir resolved to '{{ docker_context_dir | default("") }}',
      which is not the expected outputs/docker-context path. Refusing to delete it.

- name: Reset the Docker build context
  ansible.builtin.file:
    path: "{{ docker_context_dir }}"
    state: "{{ item }}"
  loop:
    - absent
    - directory

# A checkout that carries its own cypress/package.json is self consistent and
# keeps its own Cypress. Overlaying master's manifests onto it forces a Cypress
# major the branch's specs were never written for, which surfaces as a suite
# that fails to load. run.sh already applies this rule to --dashboard-dir.
- name: Stat the checkout's own Cypress manifest
  ansible.builtin.stat:
    path: "{{ dashboard_dir }}/cypress/package.json"
  register: _branch_manifest
  when: dashboard_src is not defined

# A checkout without its own manifest still needs one. Its root manifest names
# the Cypress it was written against, so prefer the nearest newer release
# branch pinning the same major. An explicit dashboard_overlay_branch wins, and
# master is the fallback, which is the previous behaviour.
- name: Read the checkout's root manifest
  ansible.builtin.slurp:
    src: "{{ dashboard_dir }}/package.json"
  register: _root_manifest
  when:
    - dashboard_src is not defined
    - not _branch_manifest.stat.exists
    - dashboard_overlay_branch is not defined

- name: Read the Cypress major the checkout was written against
  ansible.builtin.set_fact:
    _root_cypress_major: >-
      {{ ((_root.dependencies | default({})).cypress
          | default((_root.devDependencies | default({})).cypress, true)
          | default('', true) | regex_replace('^[~^]', '')).split('.')[0] }}
  vars:
    _root: "{{ (_root_manifest.content | b64decode | from_json) if (_root_manifest.content | default('') | length) > 0 else {} }}"
  when:
    - dashboard_src is not defined
    - not _branch_manifest.stat.exists
    - dashboard_overlay_branch is not defined

- name: Read the candidate manifests
  ansible.builtin.uri:
    url: "https://raw.githubusercontent.com/{{ dashboard_repo | regex_replace('\\.git$', '') }}/{{ item }}/cypress/package.json"
    return_content: true
    status_code: [200, 404]
  register: _candidate_manifests
  vars:
    # release-2.13 yields base 2 and minor 13, so the candidates are the next
    # three minors. A target that is not a release branch yields none and the
    # search falls through to master.
    _base: "{{ target_branch | regex_replace('^release-([0-9]+)[.]([0-9]+)$', '\\1') }}"
    _minor: "{{ target_branch | regex_replace('^release-([0-9]+)[.]([0-9]+)$', '\\2') }}"
    _overlay_candidates: >-
      {{ ['release-' ~ _base ~ '.' ~ (_minor | int + 1),
          'release-' ~ _base ~ '.' ~ (_minor | int + 2),
          'release-' ~ _base ~ '.' ~ (_minor | int + 3)]
         if _minor is match('^[0-9]+$') else [] }}
  loop: "{{ _overlay_candidates }}"
  loop_control:
    label: "{{ item }}"
  changed_when: false
  when:
    - dashboard_src is not defined
    - not _branch_manifest.stat.exists
    - dashboard_overlay_branch is not defined
    - _root_cypress_major | length > 0

# The candidates are in ascending order, so the first match is the nearest
# newer branch, the one whose spec set has drifted least from the target.
- name: Set the overlay source
  ansible.builtin.set_fact:
    _overlay_source: "{{ dashboard_overlay_branch | default(_matching | default([]) | first | default('master', true), true) }}"
  vars:
    _matching: >-
      {{ _candidate_manifests.results | default([])
         | selectattr('status', 'eq', 200)
         | selectattr('content', 'search', '"cypress"\s*:\s*"[~^]?' ~ _root_cypress_major ~ '[.]')
         | map(attribute='item') | list }}
  when: dashboard_src is not defined

- name: Report the overlay source
  ansible.builtin.debug:
    msg: "{{ _reason }}, overlaying from {{ _overlay_source }}"
  vars:
    _reason: >-
      {%- if dashboard_overlay_branch is defined and dashboard_overlay_branch -%}
        dashboard_overlay_branch names the source for {{ target_branch }}
      {%- elif _root_cypress_major | default('') | length > 0 -%}
        {{ target_branch }} pins Cypress {{ _root_cypress_major }}
      {%- else -%}
        {{ target_branch }} names no Cypress version in its root manifest
      {%- endif -%}
  when:
    - dashboard_src is not defined
    - not _branch_manifest.stat.exists

- name: Overlay dependency files from dashboard master onto release branches
  ansible.builtin.shell: |
    set -e
    cd {{ dashboard_dir }}
    OVERLAY_BRANCH="{{ _overlay_source }}"
    echo "[overlay] target_branch={{ target_branch }}, overlay_from=${OVERLAY_BRANCH}"
    git fetch --depth=1 origin "${OVERLAY_BRANCH}" || {
      echo "[overlay] ERROR: git fetch origin ${OVERLAY_BRANCH} failed"
      exit 1
    }
    # Required dependency files, fail if missing
    git checkout FETCH_HEAD -- cypress/package.json cypress/yarn.lock package.json yarn.lock cypress.config.ts || {
      echo "[overlay] ERROR: required dependency files missing on ${OVERLAY_BRANCH}"
      exit 1
    }
    # Optional files, may not exist on all branches
    git checkout FETCH_HEAD -- cypress/support/qase.ts 2>/dev/null || \
      echo "[overlay] NOTICE: cypress/support/qase.ts not found on ${OVERLAY_BRANCH}, skipping"
    echo "[overlay] OK, overlaid dependency files from ${OVERLAY_BRANCH} onto {{ target_branch }}"
  when:
    - dashboard_src is not defined
    - target_branch != _overlay_source
    - not _branch_manifest.stat.exists
  changed_when: true

# Release branches register grep with `import ... from '@cypress/grep/src/support'`.
# v5+ moved to dist/ behind an exports map that no longer exposes src/*, so with
# master overlaid dependencies that import cannot resolve. Rewrite it to the
# v5+ `register` API, the same line master uses.
#
# A silent no-op here leaves tag filtering disabled at runtime, which looks like
# a green run that quietly executed the wrong tests. Every path therefore either
# rewrites or asserts. Local checkouts are self consistent and are left alone.
- name: Adapt the @cypress/grep registration to the overlaid version
  when: dashboard_src is not defined
  vars:
    _support_file: "{{ dashboard_dir }}/cypress/support/e2e.ts"
    _grep_spec: >-
      {{ ((_grep_manifest.content | b64decode | from_json).dependencies | default({}))['@cypress/grep']
         | default(((_grep_manifest.content | b64decode | from_json).devDependencies | default({}))['@cypress/grep'], true)
         | default('', true) }}
    _grep_major: "{{ _grep_spec | regex_search('[0-9]+') | default('', true) }}"
    _support_text: "{{ _support_after.content | b64decode }}"
    # v5+ can be bound by destructuring, by an aliased named import, or by the
    # bare name. Take the first shape that matches.
    _register_name: >-
      {{ _support_text | regex_search('register:\s*([A-Za-z_][A-Za-z0-9_]*)', '\1') | default([], true) | first
         | default(_support_text | regex_search('register\s+as\s+([A-Za-z_][A-Za-z0-9_]*)', '\1') | default([], true) | first, true)
         | default('register' if _support_text is search('{[^}]*\bregister\b[^}]*}') else '', true) }}
  block:
    - name: Read the Cypress manifest for the grep version
      ansible.builtin.slurp:
        src: "{{ dashboard_dir }}/cypress/package.json"
      register: _grep_manifest

    - name: Assert the manifest declares @cypress/grep
      ansible.builtin.assert:
        that: _grep_major | length > 0
        success_msg: "@cypress/grep {{ _grep_spec }} declared"
        fail_msg: >-
          cypress/package.json declares no usable @cypress/grep version
          (found '{{ _grep_spec }}'). The dependency overlay did not produce a
          usable manifest and tag filtering would silently do nothing.

    - name: Read the Cypress support file
      ansible.builtin.slurp:
        src: "{{ _support_file }}"
      register: _support_before

    # Registration has to live in this file. If it moved, doing nothing here
    # would leave tag filtering silently disabled at runtime.
    - name: Assert the support file registers @cypress/grep
      ansible.builtin.assert:
        that: (_support_before.content | b64decode) is search('@cypress/grep')
        success_msg: "{{ _support_file | basename }} references @cypress/grep"
        fail_msg: >-
          {{ _support_file }} does not reference @cypress/grep. Registration has
          moved and tag filtering would do nothing.

    - name: Rewrite the legacy @cypress/grep import
      ansible.builtin.replace:
        path: "{{ _support_file }}"
        regexp: '^import\s+([A-Za-z_][A-Za-z0-9_]*)\s+from\s+[''"]@cypress/grep/src/support[''"];?'
        replace: 'const { register: \1 } = require(''@cypress/grep'');'
      when: _grep_major | int >= 5

    - name: Read the Cypress support file back
      ansible.builtin.slurp:
        src: "{{ _support_file }}"
      register: _support_after

    # Whatever path was taken, the file has to bind the register export and
    # call it. Anything else registers nothing.
    - name: Assert @cypress/grep is registered
      ansible.builtin.assert:
        that:
          - _support_text is not search('@cypress/grep/src/support')
          - _register_name | length > 0
          - _support_text is search('(^|[^A-Za-z0-9_.])' ~ _register_name ~ '\(')
        success_msg: "{{ _register_name }}() registers @cypress/grep {{ _grep_spec }}"
        fail_msg: >-
          {{ _support_file }} does not register @cypress/grep v{{ _grep_major }}
          after the rewrite. It must bind the register export and call it,
          otherwise tags would not filter. Current grep lines:
          {{ _support_text.splitlines() | select('search', '@cypress/grep') | join(' / ') }}
      when: _grep_major | int >= 5

- name: Configure Rancher users and role bindings
  ansible.builtin.include_role:
    name: rancher_user_setup
  vars:
    rancher_admin_password: "{{ rancher_password }}"
    # Fail fast if tests need standard_user but login failed; warn-only otherwise
    rancher_user_on_error: "{{ 'fail' if '@standardUser' in cypress_tags else 'warn' }}"
    rancher_users:
      - username: standard_user
        password: "{{ rancher_password }}"
        global_roles:
          - user
        project_roles:
          - role: project-member
            project: Default
            cluster: local

- name: Handle imported kubeconfig from provision
  when: create_initial_clusters | bool
  block:
    - name: Check kubeconfig exists
      ansible.builtin.stat:
        path: "{{ outputs_dir }}/kubeconfig-import.yaml"
      register: _kubeconfig_file

    - name: Encode import kubeconfig to base64
      ansible.builtin.slurp:
        src: "{{ outputs_dir }}/kubeconfig-import.yaml"
      register: import_kubeconfig_b64
      when: _kubeconfig_file.stat.exists

    - name: Set kubeconfig variables
      ansible.builtin.set_fact:
        imported_kubeconfig: "{{ import_kubeconfig_b64.content }}"
      when: _kubeconfig_file.stat.exists

    - name: Write imported_config for Docker
      ansible.builtin.copy:
        content: "{{ import_kubeconfig_b64.content | b64decode }}"
        dest: "{{ docker_context_dir }}/imported_config"
        mode: "0600"
      when: _kubeconfig_file.stat.exists

    - name: Warn if kubeconfig missing
      ansible.builtin.debug:
        msg: >-
          kubeconfig-import.yaml not found, import cluster tests will be
          skipped. Run with --tags provision to create import clusters.
      when: not _kubeconfig_file.stat.exists

- name: Remove kubeconfig lines when no import cluster
  when: not (create_initial_clusters | bool) or (_kubeconfig_file is defined and not _kubeconfig_file.stat.exists)
  block:
    - name: Strip kubectl from cypress.sh
      ansible.builtin.lineinfile:
        path: "{{ dashboard_dir }}/cypress/jenkins/cypress.sh"
        regexp: "kubectl"
        state: absent

    # Removes both the COPY of the kubeconfig and the chmod that follows it.
    - name: Strip imported_config from Dockerfile.ci
      ansible.builtin.lineinfile:
        path: "{{ dashboard_dir }}/cypress/jenkins/Dockerfile.ci"
        regexp: 'imported_config|/root/\.kube/config'
        state: absent

- name: Set custom node key from SSH key file
  when:
    - create_initial_clusters | bool
    - custom_node_key is not defined
    - ssh_key is defined
  block:
    - name: Read and base64-encode SSH private key
      ansible.builtin.slurp:
        src: "{{ ssh_key }}"
      register: ssh_key_content

    - name: Set custom_node_key fact
      ansible.builtin.set_fact:
        custom_node_key: "{{ ssh_key_content.content }}"

- name: Substitute CYPRESSTAGS placeholder in cypress.sh
  ansible.builtin.replace:
    path: "{{ dashboard_dir }}/cypress/jenkins/cypress.sh"
    regexp: "CYPRESSTAGS"
    replace: "{{ cypress_tags }}"

- name: Verify overlay files exist before Docker build
  ansible.builtin.shell: |
    set -e
    cd {{ dashboard_dir }}
    missing=""
    for f in cypress/package.json cypress/yarn.lock cypress/jenkins/cypress.sh cypress/jenkins/Dockerfile.ci cypress/jenkins/grep-filter.ts; do
      [ -f "$f" ] || missing="${missing} ${f}"
    done
    if [ -n "${missing}" ]; then
      echo "[verify] ERROR: Missing required files:${missing}"
      echo "[verify] {{ _verify_hint }}"
      exit 1
    fi
    echo "[verify] OK, key files present, CYPRESSTAGS=$(grep -c 'CYPRESSTAGS' cypress/jenkins/cypress.sh || echo 'replaced')"
  vars:
    _verify_hint: >-
      {{
        'The dependency overlay is skipped for local checkouts, so the directory passed to
         --dashboard-dir must already provide cypress/package.json and cypress/yarn.lock.
         That layout exists from release-2.14 onwards.'
        if dashboard_src is defined
        else 'The overlay from ' ~ (dashboard_overlay_branch | default('master', true)) ~ ' did not produce them.'
      }}
  changed_when: false

- name: Read Dockerfile.ci back
  ansible.builtin.slurp:
    src: "{{ dashboard_dir }}/cypress/jenkins/Dockerfile.ci"
  register: _dockerfile_ci

# Jenkins agents have no buildx, so docker build falls back to the legacy
# builder. It rejects BuildKit only instructions outright, and the failure
# surfaces as an opaque build error rather than a bad Dockerfile.
- name: Reject BuildKit-only syntax in Dockerfile.ci
  ansible.builtin.assert:
    that: _buildkit_only | length == 0
    success_msg: Dockerfile.ci builds under the legacy builder
    fail_msg: >-
      Dockerfile.ci uses BuildKit only syntax that the legacy builder on the
      Jenkins agents rejects: {{ _buildkit_only | join(' / ') }}. Rewrite it so
      the image builds under both builders, for example a plain COPY followed
      by a separate RUN chmod.
  vars:
    _buildkit_only: >-
      {{ (_dockerfile_ci.content | b64decode).splitlines()
         | select('search', '^\s*((COPY|ADD)\s+--(chmod|link|exclude)|RUN\s+--(mount|network|security))[\s=]')
         | list }}

- name: Read the dashboard Cypress manifest
  ansible.builtin.slurp:
    src: "{{ dashboard_dir }}/cypress/package.json"
  register: _cypress_manifest

# The image bakes the binary named by cypress_version, while yarn installs the
# npm package from this manifest at container start. A mismatch makes Cypress
# redownload the binary every run, and fail outright where download.cypress.io
# is unreachable. The manifest wins because it is what yarn actually installs.
- name: Use the Cypress version the checkout installs
  ansible.builtin.set_fact:
    cypress_version: "{{ _pinned_cypress }}"
  vars:
    _pinned_cypress: >-
      {{ ((_cypress_manifest.content | b64decode | from_json).dependencies | default({})).cypress
         | default(((_cypress_manifest.content | b64decode | from_json).devDependencies | default({})).cypress, true)
         | default('', true) | regex_replace('^[~^]', '') }}
  when:
    - _pinned_cypress | length > 0
    - _pinned_cypress != cypress_version

- name: Report the Cypress version in use
  ansible.builtin.debug:
    msg: "Cypress {{ cypress_version }} for {{ target_branch | default('the local checkout', true) }}"

# cypress.sh and grep-filter.ts resolve these at run time inside the container.
# They come from cypress/yarn.lock and nothing is added at run time, so a
# checkout that does not declare one cannot be filled in later.
- name: Read what the checkout declares
  ansible.builtin.set_fact:
    _missing_runtime_deps: "{{ _runtime_deps | difference(_decl) }}"
  vars:
    _m: "{{ (_cypress_manifest.content | b64decode | from_json) if (_cypress_manifest.content | default('') | length) > 0 else {} }}"
    _decl: "{{ ((_m.dependencies | default({})) | combine(_m.devDependencies | default({}))) | list }}"

- name: Assert the checkout declares what the run loads
  ansible.builtin.assert:
    that: _missing_runtime_deps | length == 0
    success_msg: "the checkout declares the packages the run loads"
    fail_msg: >-
      This checkout does not declare {{ _missing_runtime_deps | sort | join(', ') }}.
      Cypress, the reporters and the tag filtering packages are installed from
      cypress/yarn.lock, so a checkout that does not declare one has no way to
      run, filter or report. release-2.14 and newer declare all of them.
      {{ 'The directory passed to --dashboard-dir has to supply them, so use a newer branch or drop --dashboard-dir.'
         if dashboard_src is defined
         else 'Older branches get them from the overlay, which did not supply them here.' }}

- name: Show Docker build args
  ansible.builtin.debug:
    msg: >-
      Building dashboard-test image:
      Cypress={{ cypress_version }}, Node={{ nodejs_version }},
      Chrome={{ chrome_version }}

- name: Build dashboard-test Docker image
  ansible.builtin.command:
    argv:
      - docker
      - build
      - -t
      - "dashboard-test:{{ executor_tag }}"
      - -f
      - "{{ dashboard_dir }}/cypress/jenkins/Dockerfile.ci"
      - --build-arg
      - "YARN_VERSION={{ yarn_version }}"
      - --build-arg
      - "NODE_VERSION={{ nodejs_version }}"
      - --build-arg
      - "CYPRESS_VERSION={{ cypress_version }}"
      - --build-arg
      - "CHROME_VERSION={{ chrome_version }}"
      - "{{ docker_context_dir }}"
  changed_when: true

# The docker build output is only shown when the build fails, so a successful
# build says nothing about what actually landed in the image. That silence is
# how a BuildKit only COPY flag reached Jenkins unnoticed. These tasks read the
# facts back out of the finished image.
- name: Read the Cypress binaries baked into the image
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --entrypoint
      - ls
      - "dashboard-test:{{ executor_tag }}"
      - /root/.cache/Cypress
  register: _image_cypress
  changed_when: false
  failed_when: false

- name: Read the kubectl version baked into the image
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --entrypoint
      - kubectl
      - "dashboard-test:{{ executor_tag }}"
      - version
      - --client
  register: _image_kubectl
  changed_when: false
  failed_when: false

- name: Read the kubeconfig mode inside the image
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --entrypoint
      - stat
      - "dashboard-test:{{ executor_tag }}"
      - -c
      - "%a %n"
      - /root/.kube/config
  register: _image_kubeconfig
  changed_when: false
  failed_when: false
  when: create_initial_clusters | bool

# The npm package is installed at container start from cypress/package.json,
# while the binary is baked in at build time. A mismatch makes Cypress
# re-download the binary on every run and fail outright on hosts with no
# access to download.cypress.io.
- name: Assert the image carries the expected Cypress binary
  ansible.builtin.assert:
    that: cypress_version in (_image_cypress.stdout_lines | default([]))
    success_msg: "Cypress binary {{ cypress_version }} is present"
    fail_msg: >-
      The image was built for a different cypress_version. Wanted
      {{ cypress_version }}, image holds
      '{{ _image_cypress.stdout_lines | default([]) | join(', ') }}'.

- name: Assert the image carries kubectl
  ansible.builtin.assert:
    that: _image_kubectl.rc == 0
    success_msg: kubectl is present
    fail_msg: >-
      kubectl is missing from the image. The imported cluster spec pipes the
      registration manifest into kubectl apply, so that test cannot pass.

# Local runs start the container with --user, so a non-root user has to be able
# to read the kubeconfig. Jenkins runs as root and would never notice a mode
# that is too strict.
- name: Assert the kubeconfig is present and readable
  ansible.builtin.assert:
    that:
      - _image_kubeconfig.rc == 0
      - _image_kubeconfig.stdout is search('^[0-7][0-7][4-7] ')
    success_msg: the kubeconfig is present and world readable
    fail_msg: >-
      create_initial_clusters is true but /root/.kube/config is missing or is
      not world readable. Local runs pass --user, so a non-root user has to be
      able to read it.
  when: create_initial_clusters | bool

# Informational only. Reachability is already asserted by "Wait for import
# cluster API", so failing again here would add a way for a good build to break.
- name: Reach the imported cluster from inside the image
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --entrypoint
      - kubectl
      - "dashboard-test:{{ executor_tag }}"
      - --request-timeout=20s
      - get
      - nodes
      - -o
      - wide
  register: _image_cluster_reach
  changed_when: false
  failed_when: false
  when: create_initial_clusters | bool

- name: Show what the image verification found
  ansible.builtin.debug:
    msg: >-
      cypress={{ _image_cypress.stdout_lines | default([]) | join(',') }}
      kubectl={{ (_image_kubectl.stdout_lines | default([]) | join(' ')) | truncate(60) }}
      kubeconfig={{ _image_kubeconfig.stdout | default('skipped') | trim }}

- name: Show the imported cluster as the image sees it
  ansible.builtin.debug:
    msg: >-
      {{ _image_cluster_reach.stdout_lines | default([])
         | ternary(_image_cluster_reach.stdout_lines | default([]),
                   ['could not reach the imported cluster from the image']) }}
  when: create_initial_clusters | bool

- name: Generate .env file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ workspace_dir }}/.env"
    mode: "0644"

- name: Warn when qase_enabled is true but QASE_TOKEN is not set
  ansible.builtin.debug:
    msg: >-
      WARNING: qase_enabled is true but QASE_TOKEN is not set.
      Test results will NOT be reported to Qase.
      Export QASE_TOKEN in your environment before running (do not put the token in vars.yaml).
  when: (qase_enabled | default(false)) and (qase_token | default('') | length == 0)

- name: Notice when percy_enabled but @percy not in cypress_tags, skipping Percy
  ansible.builtin.debug:
    msg: >-
      NOTICE: percy_enabled is true but '@percy' is not in cypress_tags ('{{ cypress_tags }}').
      Percy will be skipped for this run. Add '@percy' to cypress_tags to enable Percy snapshots.
  when: (percy_enabled | default(false)) and ("@percy" not in cypress_tags)

- name: Warn when percy_enabled and qase_enabled together risk Percy build failure
  ansible.builtin.debug:
    msg: >-
      WARNING: percy_enabled and qase_enabled are both true.
      A Qase API failure in before:run will silently abort Percy snapshot collection
      and fail the Percy build. Disable one or ensure QASE_TOKEN is valid before running.
  when: (percy_enabled | default(false)) and (qase_enabled | default(false))
