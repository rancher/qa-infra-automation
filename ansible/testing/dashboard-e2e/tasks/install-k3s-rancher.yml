# Install K3s on clusters and deploy Rancher via Helm.
# K3s installs run in parallel (rancher-server + importcluster).
# Rancher is deployed after K3s is ready using the rancher-ha playbook.
#
# Both clusters set k3s_node_external_ip to false. Otherwise k3s advertises the
# node's public IP, making that the kubernetes service endpoint. The security
# group only allows node to node traffic over private addresses, so CoreDNS
# cannot reach the API server, never becomes ready, and the cluster agent
# crash loops on an unresolvable Rancher host.

- name: Write k3s vars for rancher server
  ansible.builtin.copy:
    content: |
      kubernetes_version: '{{ k3s_kubernetes_version }}'
      kubeconfig_file: '{{ outputs_dir }}/kubeconfig-rancher.yaml'
      node_token_file: '/tmp/node_token_rancher.txt'
      channel: "stable"
      k3s_node_external_ip: false
    dest: "{{ outputs_dir }}/rancher-server-k3s-vars.yaml"
    mode: "0644"
  when: job_type == 'recurring'

- name: Install k3s on rancher server cluster (async)
  ansible.builtin.command:
    cmd: >-
      ansible-playbook
      -i {{ outputs_dir }}/inventory-rancher-server/inventory.yml
      {{ qa_infra_dir }}/ansible/k3s/default/k3s-playbook.yml
      --extra-vars @{{ outputs_dir }}/rancher-server-k3s-vars.yaml
      {{ ansible_verbose_flag }}
    chdir: "{{ qa_infra_dir }}"
  environment:
    ANSIBLE_CONFIG: "{{ qa_infra_dir }}/ansible/k3s/default/ansible.cfg"
  async: 600
  poll: 0
  register: k3s_rancher_job
  changed_when: true
  when: job_type == 'recurring'

- name: Write k3s vars for import cluster
  ansible.builtin.copy:
    content: |
      kubernetes_version: '{{ k3s_kubernetes_version }}'
      kubeconfig_file: '{{ outputs_dir }}/kubeconfig-import.yaml'
      node_token_file: '/tmp/node_token_import.txt'
      channel: "stable"
      k3s_node_external_ip: false
    dest: "{{ outputs_dir }}/import-k3s-vars.yaml"
    mode: "0644"
  when: create_initial_clusters | bool

- name: Install k3s on import cluster (async)
  ansible.builtin.command:
    cmd: >-
      ansible-playbook
      -i {{ outputs_dir }}/inventory-importcluster/inventory.yml
      {{ qa_infra_dir }}/ansible/k3s/default/k3s-playbook.yml
      --extra-vars @{{ outputs_dir }}/import-k3s-vars.yaml
      {{ ansible_verbose_flag }}
    chdir: "{{ qa_infra_dir }}"
  environment:
    ANSIBLE_CONFIG: "{{ qa_infra_dir }}/ansible/k3s/default/ansible.cfg"
  when: create_initial_clusters | bool
  async: 600
  poll: 0
  register: k3s_import_job
  changed_when: true

- name: Wait for import cluster k3s install
  ansible.builtin.async_status:
    jid: "{{ k3s_import_job.ansible_job_id }}"
  register: k3s_import_result
  until: k3s_import_result.finished | bool
  retries: 60
  delay: 10
  failed_when: k3s_import_result.finished | bool and k3s_import_result.rc | default(1) != 0
  when: create_initial_clusters | bool

- name: Wait for rancher server k3s install
  ansible.builtin.async_status:
    jid: "{{ k3s_rancher_job.ansible_job_id }}"
  register: k3s_rancher_result
  until: k3s_rancher_result.finished | bool
  retries: 60
  delay: 10
  failed_when: k3s_rancher_result.finished | bool and k3s_rancher_result.rc | default(1) != 0
  when: job_type == 'recurring'

- name: Verify rancher kubeconfig exists
  ansible.builtin.stat:
    path: "{{ outputs_dir }}/kubeconfig-rancher.yaml"
  register: rancher_kubeconfig
  failed_when: not rancher_kubeconfig.stat.exists
  when: job_type == 'recurring'

- name: Verify import kubeconfig exists
  ansible.builtin.stat:
    path: "{{ outputs_dir }}/kubeconfig-import.yaml"
  register: import_kubeconfig
  failed_when: not import_kubeconfig.stat.exists
  when: create_initial_clusters | bool

- name: Write rancher vars
  ansible.builtin.copy:
    content: |
      rancher_version: '{{ rancher_version }}'
      rancher_image_tag: '{{ "" if rancher_image_tag_from_chart | default(false) | bool else (rancher_image_tag_resolved | default(rancher_image_tag)) }}'
      rancher_image: '{{ rancher_image | default("") }}'
      cert_manager_version: '{{ cert_manager_version }}'
      kubeconfig_file: '{{ outputs_dir }}/kubeconfig-rancher.yaml'
      fqdn: '{{ rancher_host }}'
      prefix: '{{ prefix }}'
      custom_node_ip: '{{ custom_node_ip | default("") }}'
      bootstrap_password: '{{ bootstrap_password }}'
      password: '{{ rancher_password }}'
      rancher_chart_repo: '{{ rancher_helm_repo }}'
      rancher_chart_repo_url: '{{ rancher_chart_url }}'
      {% if ui_offline_preferred is defined %}
      # Opt in only, and lower-cased on purpose: an unquoted `true` in vars.yaml
      # parses as a Python bool and renders as `True`, which Rancher does not
      # match, so the UI silently falls back to the CDN. Observed on build #95.
      extra_helm_values:
        extraEnv:
          - name: CATTLE_UI_OFFLINE_PREFERRED
            value: '{{ ui_offline_preferred | string | lower }}'
      {% endif %}
    dest: "{{ outputs_dir }}/rancher-vars.yaml"
    mode: "0644"
  when: job_type == 'recurring'

- name: Deploy Rancher
  ansible.builtin.command:
    cmd: >-
      ansible-playbook
      {{ qa_infra_dir }}/ansible/rancher/default-ha/rancher-playbook.yml
      --extra-vars @{{ outputs_dir }}/rancher-vars.yaml
      {{ ansible_verbose_flag }}
    chdir: "{{ qa_infra_dir }}"
  environment:
    ANSIBLE_CONFIG: "{{ qa_infra_dir }}/ansible/k3s/default/ansible.cfg"
  async: 1200
  poll: 30
  changed_when: true
  register: _deploy_rancher
  # ignore_errors rather than failed_when: false. The latter rewrites the result
  # as a success, so "is failed" never fires and the diagnosis below would be
  # dead code that silently never ran. The explicit fail task at the end of this
  # group still ends the play.
  ignore_errors: true
  when: job_type == 'recurring'

# An async task killed at its timeout returns "Timeout exceeded" with an empty
# stdout, so twenty minutes of deploying leave nothing to read. The cluster still
# knows: a pod that cannot pull its image says so in its status and events. Read
# that out before the workspace is destroyed, which is the only chance.
- name: Report why the deploy did not finish
  when:
    - job_type == 'recurring'
    - _deploy_rancher is defined
    - _deploy_rancher is failed
  vars:
    # argv, not cmd: a jsonpath contains spaces and cmd would split it into
    # separate arguments, leaving kubectl with "jsonpath={range".
    _kubectl:
      - kubectl
      - --kubeconfig
      - "{{ outputs_dir }}/kubeconfig-rancher.yaml"
      - -n
      - cattle-system
    # The single space the folded scalar inserts at each line break is the
    # column separator, so the fields need no explicit padding.
    _waiting_jsonpath: >-
      jsonpath={range .items[*]}{.metadata.name}
      {.spec.containers[*].image}
      {.status.containerStatuses[*].state.waiting.reason}
      {.status.containerStatuses[*].state.waiting.message}{"\n"}{end}
  block:
    - name: Collect the cluster state that explains it
      # Three reads rather than one shell script: no pipes, no quoting, and
      # each answer is labelled by the item that asked for it.
      ansible.builtin.command:
        argv: "{{ _kubectl + item.args }}"
      register: _deploy_diag
      changed_when: false
      failed_when: false
      loop:
        - name: pods
          args: [get, pods, -o, wide]
        - name: images and waiting reasons
          args: [get, pods, -o, "{{ _waiting_jsonpath }}"]
        - name: events
          args: [get, events, --sort-by=.lastTimestamp]
      loop_control:
        label: "{{ item.name }}"

    - name: Show the deploy diagnosis
      ansible.builtin.debug:
        msg: "{{ ['--- ' ~ item.item.name ~ ' ---'] + (item.stdout_lines | default([]))[-25:] }}"
      loop: "{{ _deploy_diag.results | default([]) }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Fail with what the deploy actually did
      ansible.builtin.fail:
        msg: >-
          Deploying Rancher failed: {{ _deploy_rancher.msg | default('see above') }}.
          The pod state and events above are from the cluster when it gave up.

- name: Wait for import cluster API
  ansible.builtin.command:
    cmd: kubectl --kubeconfig {{ outputs_dir }}/kubeconfig-import.yaml get nodes
  register: import_api_check
  until: import_api_check.rc == 0
  retries: 12
  delay: 10
  changed_when: false
  when: create_initial_clusters | bool

# Reported unconditionally, because a rolling tag serves a different UI from one
# run to the next and the log otherwise gives no way to tell which one a result
# came from.
- name: Read which UI Rancher serves
  kubernetes.core.k8s_info:
    kubeconfig: "{{ outputs_dir }}/kubeconfig-rancher.yaml"
    api_version: management.cattle.io/v3
    kind: Setting
    name: "{{ item }}"
  loop:
    - ui-offline-preferred
    - ui-dashboard-index
  register: _ui_settings
  until: _ui_settings.resources | default([]) | length > 0
  retries: 30
  delay: 10
  failed_when: false
  when: job_type == 'recurring'

- name: Assert Rancher serves the UI embedded in the image
  vars:
    _setting: "{{ (_ui_settings.results | first).resources | default([]) | first | default({}, true) }}"
    # `value` is what an operator set, `default` is what the deployment was
    # given, which is where CATTLE_ env vars land. The effective setting is
    # `value` when it is non-empty, otherwise `default`.
    _effective: "{{ (_setting.value | default('', true) or _setting.default | default('', true)) | string | lower }}"
  ansible.builtin.assert:
    that: _effective == (ui_offline_preferred | string | lower)
    success_msg: "ui-offline-preferred={{ _effective }}, as requested."
    fail_msg: >-
      ui-offline-preferred={{ _effective | default('unset', true) }}, but
      ui_offline_preferred={{ ui_offline_preferred }} was requested.
      CATTLE_UI_OFFLINE_PREFERRED did not reach the deployment.
  when:
    - job_type == 'recurring'
    - ui_offline_preferred is defined

# A rolling tag names a different build from one hour to the next, and the chart
# version reported earlier is not the build either: `v2.15-head` resolves to
# chart 2.15.0 whichever commit it was cut from. Record what actually ran, so a
# result can be tied to a build afterwards. `server-version` carries Rancher's
# own string, which for a `-head` image is `v{minor}-{commit}-head`, and the
# pod carries the digest the node pulled.
- name: Read the Rancher server version
  kubernetes.core.k8s_info:
    kubeconfig: "{{ outputs_dir }}/kubeconfig-rancher.yaml"
    api_version: management.cattle.io/v3
    kind: Setting
    name: server-version
  register: _rancher_version
  failed_when: false
  when: job_type == 'recurring'

- name: Read the Rancher pods
  kubernetes.core.k8s_info:
    kubeconfig: "{{ outputs_dir }}/kubeconfig-rancher.yaml"
    kind: Pod
    namespace: cattle-system
    label_selectors:
      - app=rancher
  register: _rancher_pods
  failed_when: false
  when: job_type == 'recurring'

# Reported rather than asserted: an unidentified build is worth knowing about
# but is not a reason to fail a run that otherwise has results.
- name: Resolve what the run is testing
  vars:
    _setting: "{{ (_rancher_version.resources | default([]) | first) | default({}, true) }}"
    _pod: "{{ (_rancher_pods.resources | default([]) | first) | default({}, true) }}"
    _ui_offline_res: "{{ (_ui_settings.results | default([]) | first) | default({}, true) }}"
    _ui_index_res: "{{ (_ui_settings.results | default([]) | last) | default({}, true) }}"
    _ui_offline_obj: "{{ (_ui_offline_res.resources | default([]) | first) | default({}, true) }}"
    _ui_index_obj: "{{ (_ui_index_res.resources | default([]) | first) | default({}, true) }}"
  ansible.builtin.set_fact:
    _rancher_container: "{{ (_pod.status | default({}, true)).containerStatuses | default([], true) | first | default({}, true) }}"
    _server_version: "{{ _setting.value | default('', true) or _setting.default | default('', true) }}"
    _ui_offline_value: "{{ _ui_offline_obj.value | default('', true) or _ui_offline_obj.default | default('', true) }}"
    _ui_index_value: "{{ _ui_index_obj.value | default('', true) or _ui_index_obj.default | default('', true) }}"
  when: job_type == 'recurring'

- name: Decide where the UI came from
  vars:
    # `dynamic` resolves through settings.IsRelease(), which is
    # `!strings.Contains(serverVersion, "head") && regexp("^v[0-9]").Match(serverVersion)`.
    # A release serves the UI it embeds, anything else serves ui-dashboard-index.
    _is_release: "{{ 'head' not in _server_version and _server_version is match('^v[0-9]') }}"
    # Cast before comparing: the setting comes back from the k8s API as a real
    # boolean when it holds true or false, and `True == 'true'` is false, which
    # reported a correctly pinned UI as coming from the CDN. Seen on build #96.
    _ui_offline: "{{ _ui_offline_value | string | lower }}"
  ansible.builtin.set_fact:
    _ui_from_image: "{{ _ui_offline == 'true' or (_ui_offline == 'dynamic' and _is_release) }}"
  when: job_type == 'recurring'

# Both paths publish VERSION.txt holding the dashboard commit that built them,
# so the UI can be named the same way wherever it came from. That matters
# because the two disagree: a v2.16.0-head cluster embedded ed075e6 while the
# CDN served ddfc173, so the backend and the UI came from different commits.
#
# The file is generated by scripts/build-embedded and scripts/build-hosted,
# which the dashboard repository gained on release-2.15. On release-2.14 and
# older neither exists, so the image has no VERSION.txt and the CDN path 404s,
# and a run there reported no UI at all. index.html is always present, so fall
# back to its hash: not a commit, but it changes whenever the UI does, so two
# runs naming the same hash loaded the same build. Version-agnostic on purpose,
# since the file simply appears once a branch is new enough.
- name: Read the UI build the image embeds
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ outputs_dir }}/kubeconfig-rancher.yaml"
      - -n
      - cattle-system
      - exec
      - deploy/rancher
      - -c
      - rancher
      - --
      - sh
      - -c
      - >-
        d=/usr/share/rancher/ui-dashboard/dashboard;
        if [ -s "$d/VERSION.txt" ]; then cat "$d/VERSION.txt";
        elif [ -f "$d/index.html" ]; then
        printf 'index %s' "$(sha1sum "$d/index.html" | cut -c1-12)"; fi
  register: _ui_image_version
  changed_when: false
  failed_when: false
  when:
    - job_type == 'recurring'
    - _ui_from_image | default(false) | bool

- name: Read the UI build the CDN is serving
  ansible.builtin.uri:
    url: "{{ _ui_index_value | regex_replace('/[^/]*$', '') }}/VERSION.txt"
    return_content: true
  register: _ui_cdn_version
  failed_when: false
  retries: 3
  delay: 5
  until: _ui_cdn_version.status | default(0) == 200
  when:
    - job_type == 'recurring'
    - not (_ui_from_image | default(false) | bool)
    - _ui_index_value | default('', true) | length > 0

- name: Name the UI build under test
  ansible.builtin.set_fact:
    ui_build: >-
      {{ (_ui_image_version.stdout | default('', true) | trim)
         if _ui_from_image | default(false) | bool
         else (_ui_cdn_version.content | default('', true) | trim) }}
  when: job_type == 'recurring'

# The CDN path is rebuilt from the release branch continuously, so the index
# hash is kept as a second fingerprint: two runs naming the same hash loaded the
# same UI even if VERSION.txt could not be read.
- name: Fingerprint the UI when it is served from the CDN
  ansible.builtin.uri:
    url: "{{ _ui_index_value }}"
    return_content: true
  register: _ui_fetch
  failed_when: false
  when:
    - job_type == 'recurring'
    - not _ui_from_image
    - _ui_index_value | length > 0

# VERSION.txt is not published on every CDN path. The dashboard branches began
# publishing it at 2.15: latest and release-2.15 answer 200, while release-2.14
# and older are 404, so a run on a maintained older minor would otherwise report
# no UI at all. The newest minor is unaffected: with no release branch cut yet
# its ui-dashboard-index points at latest, which tracks master and does publish
# the file. That flips when the branch is cut, which is why the path is read
# from the cluster rather than assumed.
#
# The index itself is the fallback, so name the build by its hash rather than
# leave the run unattributed. Gated on a 200 because a missing path still
# returns a body: releases.rancher.com answers any unknown path with the same
# 127-byte NoSuchKey document, so release-2.16, release-2.17 and a nonsense
# branch all hash to 6cf22a7f4746. Hashing that would give two runs on different
# branches the same fingerprint, which reads as the same UI. Reporting nothing
# is better than reporting a shared fake.
- name: Name the UI by its index when the CDN publishes no VERSION.txt
  ansible.builtin.set_fact:
    ui_build: "index {{ (_ui_fetch.content | hash('sha1'))[:12] }}"
  when:
    - job_type == 'recurring'
    - not _ui_from_image
    - (ui_build | default('', true) | length) == 0
    - _ui_fetch.status | default(0) == 200
    - (_ui_fetch.content | default('', true) | length) > 0

- name: Report the Rancher build under test
  vars:
    # Hashing the index rather than naming a bundle in it: the release branches
    # and master lay their assets out differently, and the index changes
    # whenever any of them does. Two runs reporting the same hash loaded the
    # same UI. The build date narrows down the commit that produced it.
    _ui_hash: "{{ (_ui_fetch.content | default('', true) | hash('sha1'))[:12] if (_ui_fetch.content | default('', true) | length) > 0 else 'unknown' }}"
    _built: "{{ _ui_fetch.last_modified | default('unknown', true) }}"
  ansible.builtin.debug:
    msg: "{{ ['server-version: ' ~ (_server_version | default('unknown', true)),
              'image:          ' ~ (_rancher_container.image | default('unknown', true)),
              'digest:         ' ~ (_rancher_container.imageID | default('unknown', true)),
              'ui-offline:     ' ~ (_ui_offline_value | default('unknown', true))]
             + ['ui build:       ' ~ (ui_build | default('unknown', true) or 'unknown')]
             + (['ui served from: the image'] if _ui_from_image
                else ['ui served from: ' ~ _ui_index_value,
                      'ui index hash:  ' ~ _ui_hash,
                      'ui built:       ' ~ _built]) }}"
  when: job_type == 'recurring'
