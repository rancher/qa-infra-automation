# Tear down all provisioned infrastructure.
# Loops through tofu workspaces and destroys each one.
# Uses --tags cleanup,never to prevent accidental execution.

- name: Destroy tofu workspaces
  # shell, not cloud.terraform.terraform. The module cannot destroy this module:
  # it builds a plan file with -var-file and then applies the plan on its own,
  # and tofu auto-loads tofu/aws/modules/cluster_nodes/terraform.tfvars at apply
  # time, which disagrees with the plan and aborts with "Mismatch between input
  # and plan variable value" for every variable the two files share. A direct
  # destroy is one step, so no plan is stored for a second command to contradict.
  ansible.builtin.shell:
    cmd: |
      set -u
      cd {{ tofu_module }} || exit 1
      tofu workspace select {{ item.workspace }} 2>/dev/null || exit 0
      out="$(tofu destroy -var-file="{{ outputs_dir }}/{{ item.workspace }}.tfvars" \
        -auto-approve -no-color -input=false 2>&1)"
      rc=$?
      printf '%s\n' "$out" | tail -n 20
      exit "$rc"
  loop:
    - { workspace: customnode, condition: "{{ create_initial_clusters | bool }}" }
    - { workspace: importcluster, condition: "{{ create_initial_clusters | bool }}" }
    - { workspace: rancher-server, condition: "{{ job_type == 'recurring' }}" }
  when: item.condition | bool
  loop_control:
    label: "{{ item.workspace }}"
  register: destroy_results
  changed_when: false
  # ignore_errors, not failed_when: false. The latter rewrites every item as a
  # success, so the collector below sees no failures and a destroy that errored
  # would strand its cloud resources silently. This keeps the flag and still
  # lets the loop finish, so one bad workspace does not skip the others.
  ignore_errors: true

- name: Report workspaces that actually had resources destroyed
  ansible.builtin.debug:
    msg: "Destroyed workspace(s): {{ _destroyed }}"
  vars:
    _destroyed: >-
      {{ destroy_results.results | selectattr('rc', 'defined')
         | selectattr('rc', 'eq', 0) | selectattr('stdout', 'defined')
         | rejectattr('stdout', 'search', '0 destroyed')
         | map(attribute='item.workspace') | list }}
  changed_when: _destroyed | length > 0
  when: _destroyed | length > 0

- name: Fail if any tofu destroy errored
  ansible.builtin.fail:
    msg: >-
      tofu destroy failed for workspace(s):
      {{ _failed | map(attribute='item.workspace') | list }}.
      {{ _failed | map(attribute='stderr') | select('defined') | join(' ') }}
  vars:
    _failed: >-
      {{ destroy_results.results | selectattr('failed', 'defined')
         | selectattr('failed') | list }}
  when: _failed | length > 0

- name: Remove Docker image
  community.docker.docker_image:
    name: dashboard-test
    tag: "{{ executor_tag }}"
    state: absent
  failed_when: false

- name: Clean up executor files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ workspace_dir }}/.env"
    - "{{ dashboard_dir }}"
  failed_when: false
