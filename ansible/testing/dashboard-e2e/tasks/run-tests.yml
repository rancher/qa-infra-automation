# Run Cypress inside Docker and collect results.
# The container runs cypress.sh which executes tests and merges JUnit XML
# via jrm. After the container exits, results are copied to the workspace
# for Jenkins artifact capture.

- name: Handle @standardUser tag
  ansible.builtin.lineinfile:
    path: "{{ workspace_dir }}/.env"
    regexp: "^TEST_USERNAME="
    line: "TEST_USERNAME=standard_user"
  when: "'@standardUser' in cypress_tags"

- name: Run Cypress tests in Docker
  # A run inside the quickstart container writes into a bind mount, so it runs
  # as the invoking user or leaves root-owned files on the host. Jenkins runs on
  # the host directly and sets neither.
  community.docker.docker_container:
    name: >-
      cypress-{{ executor_tag }}-{{ prefix | default('local') | lower | regex_replace('[^a-z0-9_.-]', '-') }}-{{
      rancher_host | default('dashboard-e2e') | lower | regex_replace('[^a-z0-9_.-]', '-') }}
    image: "dashboard-test:{{ executor_tag }}"
    detach: false
    cleanup: true
    tty: true
    init: true
    shm_size: 2g
    env_file: "{{ workspace_dir }}/.env"
    env: "{{ _container_env }}"
    user: "{{ (_host_uid ~ ':' ~ _host_gid) if _run_as_host_user else omit }}"
    volumes:
      - "{{ host_dashboard_dir }}:/e2e"
    working_dir: /e2e
  vars:
    _host_uid: "{{ lookup('env', 'HOST_UID') }}"
    _host_gid: "{{ lookup('env', 'HOST_GID') }}"
    _run_as_host_user: "{{ _host_uid | length > 0 and _host_gid | length > 0 }}"
    # NODE_PATH is cleared unconditionally: an inherited value points at the
    # host's module tree, which is not the one the image installed.
    _container_env: >-
      {{ {'NODE_PATH': ''}
         | combine({'HOME': '/tmp', 'KUBECONFIG': '/root/.kube/config'} if _run_as_host_user else {}) }}
  register: cypress_result
  # A failing suite is a result, not a broken step: the exit code is reported
  # below and the playbook decides.
  failed_when: false
  changed_when: true

- name: Log Docker errors on non-zero exit
  ansible.builtin.debug:
    msg: "{{ cypress_result.msg | default('') }}"
  when:
    - (cypress_result.status | default(1)) != 0
    - (cypress_result.msg | default('')) | length > 0

- name: Fix dashboard permissions after Docker run
  # Only when the container ran as the host user, which is the case that can
  # leave root-owned files behind in the bind mount.
  ansible.builtin.file:
    path: "{{ dashboard_dir }}"
    state: directory
    owner: "{{ lookup('env', 'HOST_UID') }}"
    group: "{{ lookup('env', 'HOST_GID') }}"
    recurse: true
  when:
    - lookup('env', 'HOST_UID') | length > 0
    - lookup('env', 'HOST_GID') | length > 0
  failed_when: false

# cypress.sh points ./node_modules at cypress/node_modules. Left behind in a
# local checkout it would send a later root `yarn install` into the test tree.
# Only the link this run created is removed, never a developer's own directory.
- name: Stat the node_modules link in the checkout
  ansible.builtin.stat:
    path: "{{ dashboard_dir }}/node_modules"
    follow: false
  register: _node_modules_link

- name: Remove the node_modules link the run created
  ansible.builtin.file:
    path: "{{ dashboard_dir }}/node_modules"
    state: absent
  when:
    - _node_modules_link.stat.islnk | default(false)
    - _node_modules_link.stat.lnk_target | default('') == 'cypress/node_modules'

- name: Set test exit code
  ansible.builtin.set_fact:
    cypress_exit_code: "{{ cypress_result.status | default(1) }}"

- name: Check results.xml exists
  ansible.builtin.stat:
    path: "{{ dashboard_dir }}/results.xml"
  register: results_xml

- name: Copy results.xml to workspace
  ansible.builtin.copy:
    src: "{{ dashboard_dir }}/results.xml"
    dest: "{{ workspace_dir }}/results.xml"
    remote_src: true
    mode: "0644"
  when: results_xml.stat.exists

- name: Find the HTML reports the run produced
  ansible.builtin.find:
    paths: "{{ dashboard_dir }}/cypress/reports/html"
    recurse: true
    file_type: file
  register: _html_reports

- name: Copy HTML reports to workspace
  # No report is not a failure here: the exit code says whether the tests
  # passed, and a suite that never started has nothing to copy.
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ workspace_dir }}/html/{{ item.path | relpath(dashboard_dir ~ '/cypress/reports/html') }}"
    remote_src: true
    mode: "0644"
  loop: "{{ _html_reports.files | default([]) }}"
  loop_control:
    label: "{{ item.path | basename }}"

- name: Report test status
  ansible.builtin.debug:
    msg: >-
      Cypress tests {{ 'PASSED' if cypress_exit_code | int == 0 else 'FAILED' }}
      (exit code: {{ cypress_exit_code }}){{
      '. results.xml copied to ' + workspace_dir + '/results.xml'
      if results_xml.stat.exists else '' }}
