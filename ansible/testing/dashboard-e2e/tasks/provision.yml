# Provision AWS infrastructure via OpenTofu.
# Creates up to 3 workspaces in parallel: rancher-server (recurring only),
# importcluster and customnode (when create_initial_clusters is true).
# For rancher-server and importcluster, the cluster_nodes_json output is
# fed to scripts/generate_inventory.py to produce a static Ansible inventory
# under outputs_dir/inventory-<workspace>/inventory.yml. The bridge script
# bakes kube_api_host, fqdn and the SSH key into all.vars so the downstream
# k3s playbook does not need the cloud.terraform tf_output lookup.

- name: Generate SSH key pair
  ansible.builtin.command:
    cmd: ssh-keygen -t rsa -b 4096 -f "{{ outputs_dir }}/id_rsa" -N ""
    creates: "{{ outputs_dir }}/id_rsa"

- name: Set SSH key path
  ansible.builtin.set_fact:
    ssh_key: "{{ outputs_dir }}/id_rsa"

- name: Tofu init
  ansible.builtin.command:
    cmd: tofu init -input=false -no-color
    chdir: "{{ tofu_module }}"
  changed_when: false

- name: Create tofu workspaces
  # All three workspaces share one module directory, so they are created before
  # any apply. The applies select their own through TF_WORKSPACE, which requires
  # the workspace to exist but does not create it.
  #
  # One left behind by an earlier run is normal on a reused executor, so
  # "already exists" is success and not a change. Anything else stops the run.
  ansible.builtin.command:
    cmd: tofu workspace new {{ item.workspace }}
    chdir: "{{ tofu_module }}"
  loop:
    - {workspace: rancher-server, condition: "{{ job_type == 'recurring' }}"}
    - {workspace: importcluster, condition: "{{ create_initial_clusters | bool }}"}
    - {workspace: customnode, condition: "{{ create_initial_clusters | bool }}"}
  loop_control:
    label: "{{ item.workspace }}"
  when: item.condition | bool
  register: _tofu_workspaces
  changed_when: _tofu_workspaces.rc | default(1) == 0
  failed_when:
    - _tofu_workspaces.rc | default(0) != 0
    - "'already exists' not in ((_tofu_workspaces.stderr | default('')) ~ (_tofu_workspaces.stdout | default('')))"

- name: Write rancher-server tfvars
  ansible.builtin.template:
    src: tfvars.j2
    dest: "{{ outputs_dir }}/rancher-server.tfvars"
    mode: "0644"
  vars:
    hostname_prefix: "jnkui-{{ prefix }}-rancher"
    node_count: "{{ server_count }}"
    vm_roles: '["etcd", "cp", "worker"]'
    instance_type: "{{ aws_instance_type }}"
  when: job_type == 'recurring'

- name: Tofu apply rancher-server
  ansible.builtin.command:
    cmd: >-
      tofu apply
      -var-file="{{ outputs_dir }}/rancher-server.tfvars"
      -auto-approve -no-color -input=false
    chdir: "{{ tofu_module }}"
  environment:
    TF_WORKSPACE: rancher-server
  register: tofu_rancher_result
  async: 600
  poll: 0
  changed_when: false
  when: job_type == 'recurring'

- name: Write importcluster tfvars
  ansible.builtin.template:
    src: tfvars.j2
    dest: "{{ outputs_dir }}/importcluster.tfvars"
    mode: "0644"
  vars:
    hostname_prefix: "jnkui-{{ prefix }}-imp"
    node_count: 1
    vm_roles: '["etcd", "cp", "worker"]'
    instance_type: "{{ aws_instance_type }}"
  when: create_initial_clusters | bool

- name: Tofu apply importcluster
  ansible.builtin.command:
    cmd: >-
      tofu apply
      -var-file="{{ outputs_dir }}/importcluster.tfvars"
      -auto-approve -no-color -input=false
    chdir: "{{ tofu_module }}"
  environment:
    TF_WORKSPACE: importcluster
  register: tofu_import_result
  async: 600
  poll: 0
  changed_when: false
  when: create_initial_clusters | bool

- name: Write customnode tfvars
  ansible.builtin.template:
    src: tfvars.j2
    dest: "{{ outputs_dir }}/customnode.tfvars"
    mode: "0644"
  vars:
    hostname_prefix: "jnkui-{{ prefix }}-ctm"
    node_count: 1
    vm_roles: '["etcd", "cp", "worker"]'
    instance_type: "t3a.xlarge"
  when: create_initial_clusters | bool

- name: Tofu apply customnode
  ansible.builtin.command:
    cmd: >-
      tofu apply
      -var-file="{{ outputs_dir }}/customnode.tfvars"
      -auto-approve -no-color -input=false
    chdir: "{{ tofu_module }}"
  environment:
    TF_WORKSPACE: customnode
  register: tofu_custom_result
  async: 600
  poll: 0
  changed_when: false
  when: create_initial_clusters | bool

- name: Wait for rancher-server tofu apply
  ansible.builtin.async_status:
    jid: "{{ tofu_rancher_result.ansible_job_id }}"
  register: tofu_rancher_status
  until: tofu_rancher_status.finished | bool
  retries: 60
  delay: 10
  failed_when: tofu_rancher_status.finished | bool and tofu_rancher_status.rc | default(1) != 0
  changed_when: >-
    tofu_rancher_status.finished | bool and
    '0 added, 0 changed, 0 destroyed' not in (tofu_rancher_status.stdout | default(''))
  when: job_type == 'recurring'

- name: Wait for importcluster tofu apply
  ansible.builtin.async_status:
    jid: "{{ tofu_import_result.ansible_job_id }}"
  register: tofu_import_status
  until: tofu_import_status.finished | bool
  retries: 60
  delay: 10
  failed_when: tofu_import_status.finished | bool and tofu_import_status.rc | default(1) != 0
  changed_when: >-
    tofu_import_status.finished | bool and
    '0 added, 0 changed, 0 destroyed' not in (tofu_import_status.stdout | default(''))
  when: create_initial_clusters | bool

- name: Wait for customnode tofu apply
  ansible.builtin.async_status:
    jid: "{{ tofu_custom_result.ansible_job_id }}"
  register: tofu_custom_status
  until: tofu_custom_status.finished | bool
  retries: 60
  delay: 10
  failed_when: tofu_custom_status.finished | bool and tofu_custom_status.rc | default(1) != 0
  changed_when: >-
    tofu_custom_status.finished | bool and
    '0 added, 0 changed, 0 destroyed' not in (tofu_custom_status.stdout | default(''))
  when: create_initial_clusters | bool

- name: Read rancher-server cluster_nodes_json
  # command, not shell: registering stdout and writing it with copy removes the
  # only reason for a shell. Not cloud.terraform.terraform_output either: that
  # puts a collection on the provisioning path, and where it does not resolve
  # the run dies here, after provisioning, with a module error naming nothing.
  ansible.builtin.command:
    cmd: tofu output -raw -no-color cluster_nodes_json
    chdir: "{{ tofu_module }}"
  environment:
    TF_WORKSPACE: rancher-server
  register: _rancher_nodes_output
  changed_when: false
  when: job_type == 'recurring'

- name: Save rancher-server cluster_nodes_json
  # Equivalent JSON, not identical bytes: Jinja native types parse the string to
  # a dict and re-serialise it with Python's spacing. Both consumers parse rather
  # than compare, generate_inventory.py with json.loads and the task below with
  # from_json, so the parsed data is identical.
  ansible.builtin.copy:
    content: "{{ _rancher_nodes_output.stdout }}"
    dest: "{{ outputs_dir }}/rancher-server-nodes.json"
    mode: "0644"
  when: job_type == 'recurring'

- name: Generate rancher-server Ansible inventory
  ansible.builtin.command:
    # argv, not cmd: cmd splits on whitespace, so a workspace path containing a
    # space would silently become two arguments.
    argv:
      - python3
      - "{{ qa_infra_dir }}/scripts/generate_inventory.py"
      - --input
      - "{{ outputs_dir }}/rancher-server-nodes.json"
      - --distro
      - k3s
      - --env
      - default
      - --schema
      - "{{ qa_infra_dir }}/ansible/_inventory-schema.yaml"
      - --output-dir
      - "{{ outputs_dir }}/inventory-rancher-server"
  changed_when: true
  when: job_type == 'recurring'

- name: Read rancher-server node metadata
  ansible.builtin.slurp:
    src: "{{ outputs_dir }}/rancher-server-nodes.json"
  register: rancher_nodes_slurp
  when: job_type == 'recurring'

- name: Set rancher_host from cluster_nodes_json metadata
  ansible.builtin.set_fact:
    rancher_host: "{{ (rancher_nodes_slurp.content | b64decode | from_json).metadata.fqdn }}"
  when: job_type == 'recurring'

# Our security group rules only allow traffic between nodes when it uses
# their internal (private) IP addresses, not their public ones. New nodes
# were trying to join the cluster using the master's public IP, which the
# security group blocks, so we use its private IP instead.
- name: Extract rancher-server master private IP
  ansible.builtin.set_fact:
    rancher_master_private_ip: >-
      {{ ((rancher_nodes_slurp.content | b64decode | from_json).nodes
          | selectattr('name', 'equalto', 'master')
          | map(attribute='private_ip') | list | first) }}
  when: job_type == 'recurring'

- name: Point rancher-server node joins at the master's private IP
  ansible.builtin.lineinfile:
    path: "{{ outputs_dir }}/inventory-rancher-server/inventory.yml"
    regexp: '^(\s*kube_api_host:\s*).*$'
    line: '\g<1>{{ rancher_master_private_ip }}'
    backrefs: true
  when: job_type == 'recurring'

- name: Read importcluster cluster_nodes_json
  # Same as the rancher-server read above: command, not shell, and a read.
  ansible.builtin.command:
    cmd: tofu output -raw -no-color cluster_nodes_json
    chdir: "{{ tofu_module }}"
  environment:
    TF_WORKSPACE: importcluster
  register: _import_nodes_output
  changed_when: false
  when: create_initial_clusters | bool

- name: Save importcluster cluster_nodes_json
  ansible.builtin.copy:
    content: "{{ _import_nodes_output.stdout }}"
    dest: "{{ outputs_dir }}/importcluster-nodes.json"
    mode: "0644"
  when: create_initial_clusters | bool

- name: Generate importcluster Ansible inventory
  ansible.builtin.command:
    argv:
      - python3
      - "{{ qa_infra_dir }}/scripts/generate_inventory.py"
      - --input
      - "{{ outputs_dir }}/importcluster-nodes.json"
      - --distro
      - k3s
      - --env
      - default
      - --schema
      - "{{ qa_infra_dir }}/ansible/_inventory-schema.yaml"
      - --output-dir
      - "{{ outputs_dir }}/inventory-importcluster"
  changed_when: true
  when: create_initial_clusters | bool

- name: Get custom node IP
  ansible.builtin.command:
    cmd: tofu output -no-color -raw kube_api_host
    chdir: "{{ tofu_module }}"
  environment:
    TF_WORKSPACE: customnode
  register: customnode_output
  changed_when: false
  when: create_initial_clusters | bool

- name: Set custom_node_ip
  ansible.builtin.set_fact:
    custom_node_ip: "{{ customnode_output.stdout }}"
  when: create_initial_clusters | bool
