---
# Adds Windows agents to an already-running RKE2 cluster.
#
# The same two plays are embedded in ansible/rke2/default/rke2-playbook.yml, so a
# `make cluster` on a mixed inventory needs nothing from here; this playbook is
# for joining Windows nodes to a cluster that is already up.
#
#   make windows-agents
#
# kubernetes_version, channel and cni are read from vars.yaml, which the Makefile
# passes as --extra-vars. Running ansible-playbook directly, supply them the same
# way: -e @ansible/rke2/default/vars.yaml

- name: Read cluster join token from the RKE2 server
  hosts: master
  become: true
  gather_facts: false
  tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - kubernetes_version is defined and kubernetes_version | length > 0
          - cni is defined and cni in ['calico', 'flannel']
          - groups['windows_workers'] | default([]) | length > 0
        fail_msg: >-
          Needs kubernetes_version and a Windows-capable cni (calico or flannel) -
          RKE2's default canal has no Windows support - plus at least one host in
          the windows_workers inventory group. Pass vars with
          -e @ansible/rke2/default/vars.yaml
      run_once: true

    - name: Read cluster token from master
      ansible.builtin.slurp:
        src: /var/lib/rancher/rke2/server/node-token
      register: master_token_content

    - name: Set cluster token fact
      ansible.builtin.set_fact:
        rke2_cluster_token: "{{ master_token_content['content'] | b64decode | trim }}"

- name: Join Windows agents to the RKE2 cluster
  hosts: windows_workers
  gather_facts: false
  pre_tasks:
    - name: Wait for SSH to become available
      ansible.builtin.wait_for_connection:
        delay: 10
        timeout: 900
    - name: Gather facts
      ansible.builtin.setup:
  roles:
    - role: rke2_windows_agent
      vars:
        rke2_windows_version: "{{ kubernetes_version }}"
        rke2_windows_channel: "{{ channel | default('stable') }}"
        rke2_token: "{{ hostvars[groups['master'][0]]['rke2_cluster_token'] }}"
      tags: ['windows', 'rke2']
