[defaults]
roles_path = ../../roles
timeout = 30
connect_timeout = 30
host_key_checking = False
interpreter_python = auto_silent

[ssh_connection]
# IdentitiesOnly is set per host by generate_inventory.py when a key file is
# given, so ssh-agent auth still works for inventories without one.
# ServerAlive*: `timeout` above only covers connect; an established session that
# goes silent - a reboot, or a Windows agent re-creating the HNS vSwitch on its
# physical NIC - otherwise leaves the client blocked on a half-open TCP
# connection forever. 15s x 8 fails the task in ~2 minutes instead.
ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=15 -o ServerAliveCountMax=8
# POSIX-only. Windows hosts turn it off per-host via ansible_pipelining: false,
# which scripts/generate_inventory.py emits for every os: windows node.
pipelining = True

[inventory]
enable_plugins = host_list, script, auto, yaml, ini