[defaults]
roles_path = ../../roles
timeout = 30
connect_timeout = 30
host_key_checking = False
interpreter_python = auto_silent

[ssh_connection]
# IdentitiesOnly=yes: without it a loaded ssh-agent offers every key it holds
# before the one we asked for, and nodes with a low MaxAuthTries reject the
# connection with "Too many authentication failures".
# ServerAlive*: `timeout` above only covers connect; an established session that
# goes silent - a reboot, or a Windows agent re-creating the HNS vSwitch on its
# physical NIC - otherwise leaves the client blocked on a half-open TCP
# connection forever. 15s x 8 fails the task in ~2 minutes instead.
ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=8
# POSIX-only. Windows hosts turn it off per-host via ansible_pipelining: false,
# which scripts/generate_inventory.py emits for every os: windows node.
pipelining = True

[inventory]
enable_plugins = host_list, script, auto, yaml, ini