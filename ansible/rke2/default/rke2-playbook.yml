---
- hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars.yaml
  vars:
    # terraform integration (optional).
    terraform_workspace: "{{ lookup('env', 'TF_WORKSPACE') | default('', true) }}"
    terraform_module_path: "{{ lookup('env', 'TERRAFORM_NODE_SOURCE') | default('tofu/aws/modules/cluster_nodes') }}"
    terraform_state_path: "{{ 'terraform.tfstate.d/' ~ terraform_workspace ~ '/terraform.tfstate' if terraform_workspace != '' and terraform_workspace != 'default' else 'terraform.tfstate' }}"
    terraform_state_file: "{{ playbook_dir | dirname | dirname | dirname }}/{{ terraform_module_path }}/{{ terraform_state_path }}"
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
  tasks:
    - name: Set variables based on tofu or environment
      when: kube_api_host is not defined or fqdn is not defined
      block:
      - name: Check if using tfstate file
        ansible.builtin.stat:
          path: "{{ terraform_state_file }}"
        register: tfstate_file_stat

      - name: Set fqdn and kube_api_host content from tfstate file if it exists
        ansible.builtin.set_fact:
          kube_api_host: "{{ lookup('cloud.terraform.tf_output', 'kube_api_host', state_file=terraform_state_file) }}"
          fqdn: "{{ lookup('cloud.terraform.tf_output', 'fqdn', state_file=terraform_state_file) }}"
          use_terraform: true
        when: tfstate_file_stat.stat.exists

      - name: Set kube_api_host content from env or vars when not using terraform
        ansible.builtin.set_fact:
          kube_api_host: "{{ lookup('env', 'KUBE_API_HOST') | default(kube_api_host if kube_api_host is defined else '', true) }}"
          use_terraform: false
        when: not tfstate_file_stat.stat.exists

      - name: Set fqdn content from env or vars when not using terraform
        ansible.builtin.set_fact:
          fqdn: "{{ lookup('env', 'FQDN') | default(fqdn if fqdn is defined else (kube_api_host if kube_api_host is defined else ''), true) }}"
        when: not tfstate_file_stat.stat.exists

    - name: Validate required variables
      assert:
        that:
          - kubernetes_version is defined
          - kubernetes_version | length > 0
          - kube_api_host is defined
          - kube_api_host | length > 0
        fail_msg: "Required variables not defined. Please ensure kubernetes_version and kube_api_host are set in vars.yaml or environment variables"

    # Fail here rather than 20 minutes later on a NotReady node: only Calico and
    # Flannel support Windows agents. RKE2's default, Canal, does not, and a
    # Windows node joined to a Canal cluster never becomes Ready.
    # https://docs.rke2.io/install/requirements
    - name: Validate CNI supports Windows when Windows agents are present
      assert:
        that:
          - cni in ['calico', 'flannel']
        fail_msg: >-
          Inventory contains Windows agents ({{ groups['windows_workers'] | join(', ') }})
          but cni is '{{ cni }}'. RKE2 supports Windows only with 'calico' or 'flannel';
          canal (the RKE2 default) has no Windows support. Set cni in vars.yaml.
      when: groups['windows_workers'] | default([]) | length > 0

- hosts: all:!windows_workers
  name: Setup nodes - RKE2 prerequisites
  become: true
  gather_facts: false
  vars_files:
    - vars.yaml
  vars:
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
  pre_tasks:
    - name: Wait for SSH to become available
      ansible.builtin.wait_for_connection:
        delay: 10
        timeout: 300
      become: false
    - name: Gather facts
      ansible.builtin.setup:
    - name: Validate required variables
      assert:
        that:
          - kubernetes_version is defined
          - kubernetes_version | length > 0
          - kube_api_host is defined
          - kube_api_host | length > 0
        fail_msg: "Required variables not defined. Set kubernetes_version and kube_api_host in vars.yaml or inventory all.vars"
      run_once: true
  roles:
    - role: rke2_setup
      tags: ['setup', 'rke2']

# Plays below are Linux-only: they are `become: true` and use systemd, dnf/zypper
# and /etc/sysctl.d. Windows agents are excluded here and handled by their own
# play further down, after the control plane is up.
- hosts: all:!windows_workers
  name: Generate RKE2 configuration files
  become: true
  gather_facts: true
  vars_files:
    - vars.yaml
  vars:
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
  pre_tasks:
    # from_yaml turns CLI-style flags ('--disable=traefik') into a plain string,
    # which would blow up later in combine — reject them up front.
    - name: Validate server_flags/worker_flags are YAML mappings
      ansible.builtin.assert:
        that:
          - >-
            (server_flags | default('') | from_yaml) is none or
            (server_flags | default('') | from_yaml) is mapping
          - >-
            (worker_flags | default('') | from_yaml) is none or
            (worker_flags | default('') | from_yaml) is mapping
        fail_msg: >-
          server_flags/worker_flags must be YAML mappings ('key: value' lines),
          not command-line flags
      tags: ['config', 'rke2']

    # Resolve compatibility inputs before role params take precedence over
    # vars_files/group_vars. Explicit rke2_* variables retain their historical
    # behavior; cni and server_flags/worker_flags remain the preferred interface.
    - name: Resolve RKE2 configuration inputs
      ansible.builtin.set_fact:
        _rke2_playbook_cni: >-
          {{ rke2_cni if rke2_cni is defined else (cni | default('')) }}
        _rke2_playbook_additional_config: >-
          {{ rke2_additional_config
             if rke2_additional_config is defined
             else (((server_flags
                     if (rke2_node_role == 'master' or
                         'cp' in (node_roles | default([])) or
                         'etcd' in (node_roles | default([])))
                     else worker_flags) | default('') | from_yaml) or {}) }}
      tags: ['config', 'rke2']
  tasks:
    # Keep this dynamic: a static role declaration exposes rke2_config defaults
    # to pre_tasks, making rke2_cni/rke2_additional_config always look defined.
    - name: Generate RKE2 configuration
      ansible.builtin.include_role:
        name: rke2_config
        apply:
          tags: ['config', 'rke2']
      vars:
        # cni wins over a cni inside rke2_additional_config, with one
        # historical exception: calico (the role default) yields to it.
        # Empty keeps the RKE2 default (no cni key rendered).
        rke2_cni: "{{ _rke2_playbook_cni }}"
        # server_flags/worker_flags are YAML scalars merged into the node's
        # config.yaml; an explicit rke2_additional_config extra-var (DTF) wins.
        rke2_additional_config: "{{ _rke2_playbook_additional_config }}"
      tags: ['config', 'rke2']

- hosts: all:!windows_workers
  name: Install RKE2 binaries
  become: true
  gather_facts: true
  vars_files:
    - vars.yaml
  vars:
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
  pre_tasks:
    # Fail fast on typos (e.g. 'rmp') before the mapping below silently
    # normalizes them to an online install with the automatic method.
    - name: Validate install_method
      ansible.builtin.assert:
        that:
          - install_method | default('') in ['', 'online', 'airgap', 'rpm', 'tar']
        fail_msg: >-
          install_method must be one of online, airgap, rpm or tar
          (got '{{ install_method | default('') }}')
      tags: ['install', 'rke2']
  roles:
    - role: rke2_install
      vars:
        rke2_version: "{{ kubernetes_version }}"
        rke2_channel: "{{ channel | default('stable') }}"
        # install_method accepts both contracts: online|airgap picks the role's
        # network mode; rpm|tar picks the upstream installer method (online).
        rke2_install_method: >-
          {{ install_method
             if install_method | default('') in ['online', 'airgap']
             else 'online' }}
        rke2_installer_method: >-
          {{ install_method
             if install_method | default('') in ['rpm', 'tar']
             else '' }}
      tags: ['install', 'rke2']

- hosts: all:!windows_workers
  name: Form RKE2 cluster
  become: true
  gather_facts: true
  vars_files:
    - vars.yaml
  vars:
    node_token_file: "/tmp/node_token.txt"
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
  pre_tasks:
    # Build the config RKE2 actually reads. DTF forwards SERVER_FLAGS through
    # rke2_additional_config (which keeps precedence); manual users may set
    # server_flags/worker_flags or rke2_server_config/rke2_agent_config, so the
    # CIS checks recompute the flags mapping here — --tags cluster included.
    - name: CIS | Resolve effective config
      set_fact:
        _rke2_is_server: "{{ node_type == 'master' or 'cp' in (node_roles | default([])) or 'etcd' in (node_roles | default([])) }}"
        _rke2_srv_eff: >-
          {{ rke2_server_config | default({}) |
             combine(rke2_additional_config |
                     default((server_flags | default('') | from_yaml) or {})) }}
        _rke2_agt_eff: >-
          {{ rke2_agent_config | default({}) |
             combine(rke2_additional_config |
                     default((worker_flags | default('') | from_yaml) or {})) }}
      tags: ['cluster', 'rke2']

    # CIS needs sysctls wherever the effective profile is cis. Servers may also
    # need the etcd user for etcd settings. Repeat the CIS predicate because
    # set_fact does not expose sibling values within the same task.
    - name: CIS | Determine flags
      set_fact:
        rke2_needs_cis_sysctl: "{{ (_rke2_is_server and 'cis' in (_rke2_srv_eff.profile | default(''))) or (not _rke2_is_server and 'cis' in (_rke2_agt_eff.profile | default(''))) }}"
        rke2_needs_etcd_user: "{{ ((_rke2_is_server and 'cis' in (_rke2_srv_eff.profile | default(''))) or (not _rke2_is_server and 'cis' in (_rke2_agt_eff.profile | default('')))) or (_rke2_is_server and (_rke2_srv_eff | dict2items | selectattr('key', 'match', '^etcd') | list | length > 0)) }}"
      tags: ['cluster', 'rke2']

    - name: CIS | Ensure etcd group exists
      group: { name: etcd, system: true }
      when: rke2_needs_etcd_user
      tags: ['cluster', 'rke2']

    - name: CIS | Ensure etcd user exists
      user: { name: etcd, group: etcd, system: true, shell: /sbin/nologin, create_home: false }
      when: rke2_needs_etcd_user
      tags: ['cluster', 'rke2']

    # Pick the first shipped rke2-cis-sysctl.conf path. RPM-installed RHEL/SLES use
    # /usr/share/rke2/ or /usr/local/share/rke2/; tarball installs use /opt/rke2/share/rke2/.
    - name: CIS | Locate shipped rke2-cis-sysctl.conf
      stat:
        path: "{{ item }}"
      loop:
        - /usr/share/rke2/rke2-cis-sysctl.conf
        - /usr/local/share/rke2/rke2-cis-sysctl.conf
        - /opt/rke2/share/rke2/rke2-cis-sysctl.conf
      when: rke2_needs_cis_sysctl
      register: cis_sysctl_candidates
      tags: ['cluster', 'rke2']

    - name: CIS | Select shipped rke2-cis-sysctl.conf
      set_fact:
        cis_sysctl_source: >-
          {{ cis_sysctl_candidates.results | default([]) |
             selectattr('stat.exists') | map(attribute='item') | first | default('') }}
      when: rke2_needs_cis_sysctl
      tags: ['cluster', 'rke2']

    - name: CIS | Copy rke2-cis-sysctl.conf into /etc/sysctl.d
      copy:
        src: "{{ cis_sysctl_source }}"
        dest: /etc/sysctl.d/60-rke2-cis.conf
        remote_src: true
        mode: '0644'
      when:
        - rke2_needs_cis_sysctl
        - cis_sysctl_source | default('') | length > 0
      tags: ['cluster', 'rke2']

    # Fallback: write the rke2-cis sysctls inline if none of the shipped paths existed.
    # Covers SLE Micro and any image where rke2-common isn't laid down yet at preflight time.
    - name: CIS | Write inline sysctls (fallback when shipped file is absent)
      copy:
        dest: /etc/sysctl.d/60-rke2-cis.conf
        mode: '0644'
        content: |
          vm.panic_on_oom=0
          vm.overcommit_memory=1
          kernel.panic=10
          kernel.panic_on_oops=1
          kernel.keys.root_maxbytes=25000000
      when:
        - rke2_needs_cis_sysctl
        - cis_sysctl_source | default('') | length == 0
      tags: ['cluster', 'rke2']

    - name: CIS | Reload sysctls
      systemd: { name: systemd-sysctl, state: restarted }
      when: rke2_needs_cis_sysctl
      tags: ['cluster', 'rke2']

    # Fetch operator-provided files before rke2 starts (e.g. the custom PSA config that
    # lets Rancher run on profile: cis). optional_files is a space-separated list of
    # "dest,url[,sha256]" entries. Opt-in, so plain CIS runs keep RKE2's strict default PSA.
    - name: Optional files | Deliver operator-provided files
      when:
        - _rke2_is_server | default(false)
        - optional_files is defined
        - (optional_files | trim | length) > 0
      block:
        # Fail clearly on a malformed entry instead of an opaque index error, and
        # split on the first comma only so URLs containing commas stay intact.
        - name: Optional files | Validate "dest,url[,sha256]" format
          ansible.builtin.assert:
            that: "',' in item"
            fail_msg: "optional_files entry '{{ item }}' must be in 'dest,url[,sha256]' form"
            quiet: true
          loop: "{{ optional_files.split() }}"

        - name: Optional files | Ensure destination directories exist
          ansible.builtin.file:
            path: "{{ (item.split(',', 1)[0] | trim) | dirname }}"
            state: directory
            mode: '0755'
          loop: "{{ optional_files.split() }}"

        - name: Optional files | Fetch and verify files with SHA256 checksums
          ansible.builtin.include_role:
            name: download_verify
          vars:
            dv_artifact_url: "{{ item.split(',', 1)[1].rsplit(',', 1)[0] | trim }}"
            dv_dest: "{{ item.split(',', 1)[0] | trim }}"
            dv_checksum_format: sha256sum_inline
            dv_checksum_inline_value: "{{ item.rsplit(',', 1)[-1] | trim | lower }}"
            dv_mode: "0644"
          loop: "{{ optional_files.split() }}"
          when: (item.rsplit(',', 1)[-1] | trim) is match('^[0-9a-fA-F]{64}$')

        # Preserve the legacy pair format for existing DTF/Jenkins callers. New
        # callers should provide the third SHA256 field so download_verify is used.
        - name: Optional files | Fetch legacy entries without checksum
          ansible.builtin.get_url:
            url: "{{ item.split(',', 1)[1] | trim }}"
            dest: "{{ item.split(',', 1)[0] | trim }}"
            mode: '0644'
          loop: "{{ optional_files.split() }}"
          when: (item.rsplit(',', 1)[-1] | trim) is not match('^[0-9a-fA-F]{64}$')
      tags: ['cluster', 'rke2']

  roles:
    - role: rke2_cluster
      vars:
        rke2_kubeconfig_dest: "{{ playbook_dir }}/kubeconfig.yaml"
      tags: ['cluster', 'rke2']

# The Windows plays run only when the inventory has Windows agents, and must sit
# before the health check: rke2_health_check fails the run unless every node in
# the inventory is Ready.
- hosts: master
  name: Read cluster join token for Windows agents
  become: true
  gather_facts: false
  vars_files:
    - vars.yaml
  vars:
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
  tasks:
    # rke2_cluster already sets this fact when it runs in the same invocation.
    # Re-reading it here keeps the Windows play working for `--tags windows` and
    # for the standalone setup-windows-agent-nodes.yml playbook.
    - name: Read cluster token from master
      ansible.builtin.slurp:
        src: /var/lib/rancher/rke2/server/node-token
      register: master_token_content
      when:
        - groups['windows_workers'] | default([]) | length > 0
        - rke2_cluster_token is not defined
      tags: ['windows', 'rke2']

    - name: Set cluster token fact
      ansible.builtin.set_fact:
        rke2_cluster_token: "{{ master_token_content['content'] | b64decode | trim }}"
      when:
        - groups['windows_workers'] | default([]) | length > 0
        - rke2_cluster_token is not defined
      tags: ['windows', 'rke2']

- hosts: windows_workers
  name: Join Windows agents to the RKE2 cluster
  # Deferred like the Linux plays: Windows nodes reboot once during user_data to
  # finish enabling the Containers feature, so gathering up front can race them.
  gather_facts: false
  vars_files:
    - vars.yaml
  pre_tasks:
    - name: Wait for SSH to become available
      ansible.builtin.wait_for_connection:
        delay: 10
        timeout: 900
      tags: ['windows', 'rke2']
    - name: Gather facts
      ansible.builtin.setup:
      tags: ['windows', 'rke2']
  roles:
    - role: rke2_windows_agent
      vars:
        rke2_windows_version: "{{ kubernetes_version }}"
        rke2_windows_channel: "{{ channel | default('stable') }}"
        rke2_token: "{{ hostvars[groups['master'][0]]['rke2_cluster_token'] }}"
      tags: ['windows', 'rke2']

- hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars.yaml
  roles:
    - role: rke2_health_check
      vars:
        rke2_kubeconfig_path: "{{ playbook_dir }}/kubeconfig.yaml"
        rke2_server_flags: "{{ server_flags | default('') }}"
        # External datastore (postgres/mysql/etc. via kine) has no local etcd pods — skip the etcd health check.
        # Substring-match the server_flags string; key-match the config dicts (avoids a value that merely contains the text).
        rke2_check_etcd_health: >-
          {{
            not (
              ('datastore-endpoint' in (server_flags | default(''))) or
              ('datastore-endpoint' in (rke2_server_config | default({}))) or
              ('datastore-endpoint' in (rke2_additional_config | default({})))
            )
          }}
      tags: ['health', 'rke2']
