---
- hosts: localhost
  name: Resolve IPv6 cluster endpoints
  connection: local
  gather_facts: false
  vars_files:
    - ./vars.yaml
  vars:
    _ipv6_cp_hosts: >-
      {{ groups['all'] | default([]) | map('extract', hostvars)
         | selectattr('node_roles', 'defined')
         | selectattr('node_roles', 'contains', 'cp')
         | map(attribute='inventory_hostname') | list }}
  tasks:
    - name: Require master and cp hosts in the inventory
      ansible.builtin.assert:
        that:
          - (groups['master'] | default([])) | length > 0
          - _ipv6_cp_hosts | length > 0
        fail_msg: >-
          Inventory needs a 'master' group and at least one host with the 'cp'
          role. Regenerate it with 'make infra-up ENV=ipv6' or start from
          inventory/inventory.yml.template.

    # kube_api_host is the cluster bootstrap endpoint, so it must be the
    # cluster-init node (master); a joining server pointed at itself never joins.
    - name: Resolve kube_api_host
      ansible.builtin.set_fact:
        kube_api_host: >-
          {{ lookup('env', 'KUBE_API_HOST')
             | default(hostvars[groups['master'][0]].ansible_host_ipv6
                       | default(hostvars[groups['master'][0]].ansible_host, true), true) }}

    - name: Resolve fqdn
      ansible.builtin.set_fact:
        fqdn: "{{ lookup('env', 'FQDN') | default(fqdn | default(''), true) | default(kube_api_host, true) }}"

    # The API server runs on cp nodes, which may exclude an etcd-only master.
    - name: Resolve the kubeconfig API endpoint
      ansible.builtin.set_fact:
        kubeconfig_api_host: >-
          {{ hostvars[_ipv6_cp_hosts | first].ansible_host_ipv6
             | default(hostvars[_ipv6_cp_hosts | first].ansible_host, true) }}

    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - kubernetes_version is defined
          - kubernetes_version | length > 0
          - kube_api_host is defined
          - kube_api_host | length > 0
        fail_msg: "Required variables not defined. Set kubernetes_version and kube_api_host in vars.yaml or via the KUBE_API_HOST environment variable"

- hosts: all:!bastion
  name: Setup nodes - RKE2 prerequisites
  become: true
  gather_facts: false
  vars_files:
    - ./vars.yaml
  vars:
    # Test hosts: keep SL Micro's transactional-update.timer off for the whole run; a catch-up
    # trigger mid-run holds the lock that zypper/rke2-uninstall.sh need. BYO: -e suse_disable_update_timer=false
    suse_disable_update_timer: true
  pre_tasks:
    - name: Wait for SSH to become available
      ansible.builtin.wait_for_connection:
        delay: 10
        timeout: 300
      become: false
    - name: Gather facts
      ansible.builtin.setup:
    - name: Resolve IPv6 kube_api_host for cluster nodes
      ansible.builtin.set_fact:
        kube_api_host: >-
          {{ hostvars[groups['master'][0]].ansible_host_ipv6
             | default(hostvars[groups['master'][0]].ansible_host, true) }}
      when: (kube_api_host | default('')) == '' or ':' not in (kube_api_host | default(''))

    - name: Sync FQDN from localhost if available
      ansible.builtin.set_fact:
        fqdn: "{{ hostvars['localhost']['fqdn'] | default(fqdn, true) }}"
      when: (fqdn | default('')) == ''
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - kubernetes_version is defined
          - kubernetes_version | length > 0
          - kube_api_host is defined
          - kube_api_host | length > 0
        fail_msg: "Required variables not defined. Set kubernetes_version and kube_api_host in vars.yaml or inventory all.vars"
      run_once: true
    # Static import so the role's tasks inherit 'always' and survive --tags setup/install.
    - name: Keep the SUSE update timer off for the run
      ansible.builtin.import_role:
        name: suse_update_timer
      tags: ['always']
  roles:
    - role: rke2_setup
      tags: ['setup', 'rke2']

- hosts: all:!bastion
  name: Generate RKE2 configuration files
  become: true
  gather_facts: true
  vars_files:
    - ./vars.yaml
  pre_tasks:
    # from_yaml turns CLI-style flags ('--disable=traefik') into a plain string,
    # which would blow up later in combine — reject them up front.
    - name: Validate server_flags/worker_flags are YAML mappings
      ansible.builtin.assert:
        that:
          - >-
            (server_flags | default('') | from_yaml) is none or
            (server_flags | default('') | from_yaml) is mapping
          - >-
            (worker_flags | default('') | from_yaml) is none or
            (worker_flags | default('') | from_yaml) is mapping
        fail_msg: >-
          server_flags/worker_flags must be YAML mappings ('key: value' lines),
          not command-line flags
      tags: ['config', 'rke2']

    # Resolve compatibility inputs before role params take precedence over
    # vars_files/group_vars. Explicit rke2_* variables retain their historical
    # behavior; cni and server_flags/worker_flags remain the preferred interface.
    - name: Resolve RKE2 configuration inputs
      ansible.builtin.set_fact:
        _rke2_playbook_cni: >-
          {{ rke2_cni if rke2_cni is defined else (cni | default('')) }}
        _rke2_playbook_additional_config: >-
          {{ rke2_additional_config
             if rke2_additional_config is defined
             else (((server_flags
                     if (rke2_node_role == 'master' or
                         'cp' in (node_roles | default([])) or
                         'etcd' in (node_roles | default([])))
                     else worker_flags) | default('') | from_yaml) or {}) }}
      tags: ['config', 'rke2']
  tasks:
    # Keep this dynamic: a static role declaration exposes rke2_config defaults
    # to pre_tasks, making rke2_cni/rke2_additional_config always look defined.
    - name: Generate RKE2 configuration
      ansible.builtin.include_role:
        name: rke2_config
        apply:
          tags: ['config', 'rke2']
      vars:
        # Empty keeps the RKE2 default; other values retain legacy precedence
        # (explicit calico still yields to a CNI in additional/server config).
        rke2_cni: "{{ _rke2_playbook_cni }}"
        # server_flags/worker_flags are YAML scalars merged into the node's
        # config.yaml; an explicit rke2_additional_config extra-var (DTF) wins.
        rke2_additional_config: "{{ _rke2_playbook_additional_config }}"
      tags: ['config', 'rke2']

- hosts: all:!bastion
  name: Configure CIS prerequisites for RKE2
  become: true
  gather_facts: true
  vars_files:
    - ./vars.yaml
  tasks:
    - name: CIS related system setup
      ansible.builtin.include_tasks: "../../tasks/rke2-cis-setup.yml"
      tags: ['cluster', 'rke2']

- hosts: all:!bastion
  name: Install RKE2 binaries
  become: true
  gather_facts: true
  vars_files:
    - ./vars.yaml
  vars:
    suse_disable_update_timer: true
  pre_tasks:
    # Fail fast on typos (e.g. 'rmp') before the mapping below silently
    # normalizes them to an online install with the automatic method.
    - name: Validate install_method
      ansible.builtin.assert:
        that:
          - install_method | default('') in ['', 'online', 'airgap', 'rpm', 'tar']
        fail_msg: >-
          install_method must be one of online, airgap, rpm or tar
          (got '{{ install_method | default('') }}')
      tags: ['install', 'rke2']
    - name: Keep the SUSE update timer off for the run
      ansible.builtin.import_role:
        name: suse_update_timer
      tags: ['always']
  roles:
    - role: rke2_install
      vars:
        rke2_version: "{{ kubernetes_version }}"
        rke2_channel: "{{ channel | default('stable') }}"
        # install_method accepts both contracts: online|airgap picks the role's
        # network mode; rpm|tar picks the upstream installer method (online).
        rke2_install_method: >-
          {{ install_method
             if install_method | default('') in ['online', 'airgap']
             else 'online' }}
        rke2_installer_method: >-
          {{ install_method
             if install_method | default('') in ['rpm', 'tar']
             else '' }}
      tags: ['install', 'rke2']

- hosts: all:!bastion
  name: Form RKE2 cluster
  become: true
  gather_facts: true
  vars_files:
    - ./vars.yaml
  vars:
    node_token_file: "/tmp/node_token.txt"
  roles:
    - role: rke2_cluster
      vars:
        rke2_kubeconfig_dest: "./kubeconfig.yaml"
      tags: ['cluster', 'rke2']

- hosts: master
  name: Check RKE2 cluster health
  become: true
  gather_facts: false
  vars_files:
    - ./vars.yaml
  environment:
    PATH: "/var/lib/rancher/rke2/bin:{{ ansible_facts['env']['PATH'] | default('/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin') }}"
  roles:
    - role: rke2_health_check
      vars:
        rke2_kubeconfig_path: "/etc/rancher/rke2/rke2.yaml"
      tags: ['health', 'rke2']

- hosts: bastion
  name: Prepare bastion node
  become: true
  gather_facts: true
  roles:
    - role: bastion_prepare

- hosts: localhost
  name: Format local kubeconfig for IPv6
  connection: local
  gather_facts: false
  tasks:
    - name: Add brackets to IPv6 server address in local kubeconfig
      ansible.builtin.replace:
        path: "{{ playbook_dir }}/kubeconfig.yaml"
        regexp: 'server: https://.*:6443'
        replace: 'server: https://[{{ kubeconfig_api_host }}]:6443'

- hosts: bastion
  name: Copy kubeconfig to bastion node
  become: false
  gather_facts: false
  tasks:
    - name: Ensure .kube directory exists
      ansible.builtin.file:
        path: "~/.kube"
        state: directory
        mode: '0700'

    - name: Copy kubeconfig to bastion
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/kubeconfig.yaml"
        dest: "~/.kube/config"
        mode: '0600'
