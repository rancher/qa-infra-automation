[defaults]
roles_path = ../../roles
timeout = 30
connect_timeout = 30
host_key_checking = False
interpreter_python = auto_silent

[ssh_connection]
# Setting ssh_args drops Ansible's built-in ControlMaster/ControlPersist, and every
# task here crosses the bastion twice (outer ssh + ProxyCommand ssh), so keep them.
# Keepalives stop long installs from being reaped on the proxied channel.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
# %%C is a fixed-length hash; a full IPv6 address in the socket name can exceed
# the 104-char UNIX socket path limit.
control_path = %(directory)s/%%C
pipelining = True
retries = 3

[inventory]
enable_plugins = host_list, script, auto, yaml, ini