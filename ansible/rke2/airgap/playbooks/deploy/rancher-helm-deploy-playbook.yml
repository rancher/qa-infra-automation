---
- name: Deploy Rancher to RKE2 Cluster using Helm
  hosts: bastion
  gather_facts: true

  vars:
    rancher_private_hostname: "{{ internal_lb_hostname }}"
    rancher_public_hostname: "{{ external_lb_hostname | default(rancher_hostname) }}"
    kubeconfig_path: "/home/{{ ansible_user }}/.kube/config"
    repo_root: "{{ playbook_dir | dirname | dirname | dirname | dirname | dirname }}"
    # cattle-config.yaml enriched by this deploy (host/adminToken, and the
    # ui-plugin-charts mirror URL when one is being served). Defaults to a file
    # rendered from ansible/_cattle-config.yaml.template; set
    # rancher_cattle_config_file to an existing file (make EXTRA_VARS or -e) to
    # enrich your own CATTLE_TEST_CONFIG instead — the render is skipped and
    # that file is never overwritten from the template.
    cattle_config_generated: "{{ repo_root }}/generated_config/cattle-config.yaml"
    rancher_cattle_config_file: "{{ cattle_config_generated }}"

  pre_tasks:
    - name: Validate admin password length before deploying
      # Rancher (v2.13+) rejects setpassword calls with passwords shorter than 12
      # characters, but accepts the same short value as bootstrapPassword at Helm
      # install time — so a short password only fails ~20 minutes into provisioning,
      # at the rancher_auth set-permanent-password step, with an opaque HTTP 422.
      # Fail here instead, before any cluster work starts.
      ansible.builtin.assert:
        that:
          - rancher_admin_password | default('') | length >= 12
        fail_msg: >-
          rancher_admin_password is {{ rancher_admin_password | default('') | length }}
          characters; the Rancher API requires at least 12. Set RANCHER_BOOTSTRAP_PASSWORD
          (which feeds rancher_admin_password in the Jenkins pipelines) to a value of at
          least 12 characters — the pipeline default 'rancherrocks' qualifies.
      when: rancher_admin_password | default('') | length > 0
    - name: Check if kubectl is available
      ansible.builtin.stat:
        path: "{{ kubeconfig_path }}"
      register: kubectl_config

    - name: Fail if kubectl is not configured
      ansible.builtin.fail:
        msg: |
          kubectl is not configured on the bastion node.
          Please run the kubectl setup playbook first:
          ansible-playbook -i inventory/inventory.yml playbooks/setup/setup-kubectl-access.yml
      when: not kubectl_config.stat.exists

    - name: Test kubectl connectivity to RKE2 cluster
      ansible.builtin.command: kubectl get nodes
      register: kubectl_nodes
      until: kubectl_nodes.rc == 0
      retries: 6
      delay: 10
      changed_when: false
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: Display cluster nodes
      ansible.builtin.debug:
        msg: "RKE2 cluster nodes: {{ kubectl_nodes.stdout_lines }}"

    - name: Check if python3-pip is already installed
      ansible.builtin.command: python3 -m pip --version
      register: pip_check
      changed_when: false
      failed_when: false

    - name: Install pip3 if not present
      ansible.builtin.package:
        name: python3-pip
        state: present
        update_cache: true
      when: pip_check.rc != 0
      become: true
      ignore_errors: true

    - name: Display pip installation status
      ansible.builtin.debug:
        msg: "Python3-pip installation: {{ 'Already installed' if pip_check.rc == 0 else 'Installation attempted (may have failed in airgap environment)' }}"

    - name: Install Ansible and required packages
      ansible.builtin.package:
        name:
          - ansible
          - python3-kubernetes
          - python3-yaml
        state: present
        update_cache: true
      become: true
      ignore_errors: true

    - name: Install Ansible Kubernetes collection if not present
      ansible.builtin.command: ansible-galaxy collection install kubernetes.core
      register: collection_install
      failed_when: collection_install.rc != 0 and 'already satisfied' not in collection_install.stderr
      changed_when: collection_install.rc == 0 and 'already satisfied' not in collection_install.stderr

  roles:
    - role: airgap_rancher_helm_deploy
      tags:
        - rancher

  post_tasks:
    - name: Wait for Rancher pods to be ready
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ rancher_namespace }}"
        label_selectors:
          - app=rancher
        kubeconfig: "{{ kubeconfig_path }}"
        wait_condition:
          type: Ready
          status: "True"
        wait_timeout: 600

    - name: Get Rancher pod status
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ rancher_namespace }}"
        label_selectors:
          - app=rancher
        kubeconfig: "{{ kubeconfig_path }}"
      register: rancher_pods

    - name: Display Rancher pod information
      ansible.builtin.debug:
        msg: |
          Rancher Pods Status:
          {% for pod in rancher_pods.resources %}
          - {{ pod.metadata.name }}: {{ pod.status.phase }}
          {% endfor %}

    - name: Add internal hostname to ingress
      when: (rancher_private_hostname is defined or internal_lb_hostname is defined) and (rancher_public_hostname is defined or external_lb_hostname is defined)
      block:
        - name: Set fact for new Ingress Rule
          ansible.builtin.set_fact:
            ingress_rules:
              - host: "{{ rancher_private_hostname }}"
                http:
                  paths:
                    - backend:
                        service:
                          name: "rancher"
                          port:
                            number: 80
                      path: /
                      pathType: ImplementationSpecific
              - host: "{{ rancher_public_hostname }}"
                http:
                  paths:
                    - backend:
                        service:
                          name: "rancher"
                          port:
                            number: 80
                      path: /
                      pathType: ImplementationSpecific

        - name: Patch the Ingress to add the new hostname rule and TLS host
          kubernetes.core.k8s:
            state: patched
            api_version: networking.k8s.io/v1
            kind: Ingress
            name: "rancher"
            namespace: "cattle-system"
            definition:
              spec:
                rules: "{{ ingress_rules }}"
                tls:
                  - hosts:
                      - "{{ rancher_private_hostname }}"
                      - "{{ rancher_public_hostname }}"
                    secretName: tls-rancher-ingress

    - name: Get LoadBalancer or NodePort service details
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Service
        name: rancher
        namespace: "{{ rancher_namespace }}"
        kubeconfig: "{{ kubeconfig_path }}"
      register: rancher_service_info

    - name: Final deployment verification
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: rancher
        namespace: "{{ rancher_namespace }}"
        kubeconfig: "{{ kubeconfig_path }}"
      register: rancher_deployment_status

    - name: Verify deployment is ready
      ansible.builtin.assert:
        that:
          - rancher_deployment_status.resources[0].status.readyReplicas | default(0) > 0
        fail_msg: "Rancher deployment is not ready"
        success_msg: "Rancher deployment is ready and functional"

    # --- Admin setup ---

    - name: Ensure tmp directory exists
      ansible.builtin.file:
        path: "{{ repo_root }}/tmp"
        state: directory
        mode: "0700"
      delegate_to: localhost

    - name: Ensure generated_config directory exists
      ansible.builtin.file:
        path: "{{ repo_root }}/generated_config"
        state: directory
        mode: "0700"
      delegate_to: localhost
      when: rancher_cattle_config_file == cattle_config_generated

    - name: Render cattle-config.yaml from the base template
      # Skipped when rancher_cattle_config_file points at a pre-existing
      # (BYO) config, which is then only enriched, never overwritten. rancher_auth
      # injects rancher.host/adminToken below; add-downstream-cluster.yml can keep
      # enriching the same file (rancher.clusterName).
      ansible.builtin.template:
        src: "{{ repo_root }}/ansible/_cattle-config.yaml.template"
        dest: "{{ cattle_config_generated }}"
        mode: "0600"
      delegate_to: localhost
      when: rancher_cattle_config_file == cattle_config_generated

    - name: Configure Rancher admin user and generate API token
      ansible.builtin.include_role:
        name: rancher_auth
      vars:
        rancher_url: "https://{{ rancher_private_hostname }}"
        # API calls go through the internal LB, but rancher.host in the cattle
        # config must be the public DNS name (external_lb_hostname) — test
        # suites reach Rancher from outside the airgap VPC.
        rancher_cattle_config_host: "{{ rancher_public_hostname }}"
        rancher_token_password: "{{ rancher_bootstrap_password }}"
        rancher_permanent_password: "{{ rancher_admin_password }}"
        rancher_token_output_file: "{{ repo_root }}/tmp/rancher-admin-token.json"
        rancher_token_output_format: "json"

    - name: Check for the ui-plugin-charts mirror fact on the bastion
      # The fact is written by the airgap_rke2_ui_plugin_mirror role, so its
      # presence means a mirror is actually being served (make ui-plugin-mirror,
      # or make all ENABLE_UI_PLUGIN_MIRROR=yes, which order the mirror step
      # before the Rancher deploy).
      ansible.builtin.stat:
        path: /etc/ansible/facts.d/ui_plugin_mirror.fact
      register: ui_mirror_fact_stat

    - name: Inject bastion ui-plugin-charts mirror into the cattle config
      # Mirrors the injection in add-downstream-cluster.yml, plus
      # skipUIExtension: false — the NeuVector suite defaults it to true in
      # airgap, which would skip the extension install and make the injected
      # URL pointless (see the airgap_rke2_ui_plugin_mirror role README).
      when: ui_mirror_fact_stat.stat.exists
      block:
        - name: Read the mirror local fact
          ansible.builtin.slurp:
            src: /etc/ansible/facts.d/ui_plugin_mirror.fact
          register: ui_mirror_fact_raw

        - name: Parse the mirror fact
          ansible.builtin.set_fact:
            ui_mirror_fact: "{{ ui_mirror_fact_raw.content | b64decode | from_json }}"

        - name: Fail when the mirror fact has no URL
          ansible.builtin.fail:
            msg: >-
              Found /etc/ansible/facts.d/ui_plugin_mirror.fact on the bastion but it
              carries no 'url'. Re-run make ui-plugin-mirror ENV=airgap to rewrite it.
          when: (ui_mirror_fact.url | default('')) | length == 0

        - name: Read the cattle config
          ansible.builtin.slurp:
            src: "{{ rancher_cattle_config_file }}"
          register: generated_cattle_config_raw
          delegate_to: localhost

        - name: Merge neuvectorTest mirror settings into the cattle config
          ansible.builtin.set_fact:
            generated_cattle_config: >-
              {{ (generated_cattle_config_raw.content | b64decode | from_yaml) | combine({
                'neuvectorTest': ((generated_cattle_config_raw.content | b64decode | from_yaml).neuvectorTest | default({})) | combine({
                  'uiPluginChartsURL': ui_mirror_fact.url,
                  'uiPluginChartsBranch': ui_mirror_fact.branch | default('main'),
                  'skipUIExtension': false
                })
              }, recursive=True) }}

        - name: Write the updated cattle config
          ansible.builtin.copy:
            content: "{{ generated_cattle_config | to_nice_yaml(indent=2) }}"
            dest: "{{ rancher_cattle_config_file }}"
            mode: "0600"
          delegate_to: localhost

        - name: Display mirror injection
          ansible.builtin.debug:
            msg: >-
              Injected {{ ui_mirror_fact.url }} (branch {{ ui_mirror_fact.branch | default('main') }})
              into {{ rancher_cattle_config_file }} as neuvectorTest.uiPluginChartsURL

    - name: Set Rancher server URL
    # server-url is embedded in generated kubeconfigs consumed by external test
    # runners, so it must be the public DNS name. The PUT itself goes through
    # the internal LB (API path stays internal by design).

      ansible.builtin.uri:
        url: "https://{{ rancher_private_hostname }}/v3/settings/server-url"
        method: PUT
        headers:
          Accept: "application/json"
          Content-Type: "application/json"
          Authorization: "Bearer {{ rancher_generated_token }}"
        body:
          name: "server-url"
          value: "https://{{ rancher_public_hostname }}"
        body_format: json
        validate_certs: false
        status_code: 200
      retries: 5
      delay: 10

    - name: Create Rancher configuration summary
      ansible.builtin.copy:
        content: |
          # Rancher Deployment Summary
          Deployment Date: {{ ansible_facts.date_time.iso8601 }}
          Rancher Version: {{ rancher_chart_version | default('latest') }}
          Hostname: {{ rancher_private_hostname }}
          Public Hostname: {{ rancher_public_hostname }}
          Namespace: {{ rancher_namespace }}
          TLS Source: {{ rancher_tls_source }}

          Admin Credentials:
          - Username: admin
          - Password: {{ rancher_admin_password }}
          - API Token: {{ rancher_generated_token }}

          Access Instructions:
          1. Configure DNS or add to /etc/hosts: {{ rancher_public_hostname }} -> <LoadBalancer-IP or Node-IP>
          2. Navigate to: https://{{ rancher_public_hostname }}
          3. Login with admin / {{ rancher_admin_password }}

          Troubleshooting:
          - Check pods: kubectl get pods -n {{ rancher_namespace }}
          - Check services: kubectl get svc -n {{ rancher_namespace }}
          - Check ingress: kubectl get ingress -n {{ rancher_namespace }}
          - View logs: kubectl logs -n {{ rancher_namespace }} -l app=rancher
        dest: "/home/{{ ansible_user }}/rancher-deployment-summary.txt"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"

    - name: Display Rancher access information
      ansible.builtin.debug:
        msg:
          - "RANCHER DEPLOYMENT COMPLETE"
          - ""
          - "  Access URL:     https://{{ rancher_public_hostname }}"
          - "  Internal URL:   https://{{ rancher_private_hostname }}"
          - "  Namespace:      {{ rancher_namespace }}"
          - ""
          - "  Admin Username: admin"
          - "  Admin Password: {{ rancher_admin_password }}"
          - "  API Token:      {{ rancher_generated_token }}"
          - ""
          - "  Service Type:   {{ rancher_service_info.resources[0].spec.type }}"
          - ""
          - "  Token file:     {{ repo_root }}/tmp/rancher-admin-token.json"
          - "  Cattle config:  {{ rancher_cattle_config_file }}"
          - "  Summary file:   /home/{{ ansible_user }}/rancher-deployment-summary.txt"
