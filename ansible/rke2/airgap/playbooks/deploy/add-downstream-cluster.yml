---
- name: Add target cluster to Rancher
  hosts: localhost
  gather_facts: true
  vars:
    admin_password: "{{ rancher_bootstrap_password | default('admin') }}"
    repo_root: "{{ playbook_dir | regex_replace('(.*)/ansible/.*', '\\1') }}"
    fqdn: "{{ rancher_hostname | default(external_lb_hostname) }}"
    # Cluster name generation: <prefix>-<random suffix>
    # Precedence for the prefix (highest first): `downstream_cluster_name_prefix` (e.g. set in inventory/group_vars),
    # `DOWNSTREAM_CLUSTER_NAME_PREFIX` env, then the hardcoded 'ansible-created' below.
    # Suffix length: override via `downstream_cluster_name_suffix_length` (default 8).
    # Set DOWNSTREAM_CLUSTER_NAME (or `cluster_name`) to use a fully custom name instead.
    # NOTE: defined as `*_default` play vars (not the override names) so inventory/group_vars/host_vars
    # can override them — play-level `vars:` otherwise outrank inventory vars.
    downstream_cluster_name_prefix_default: "{{ lookup('env', 'DOWNSTREAM_CLUSTER_NAME_PREFIX') | default('ansible-created', true) }}"
    downstream_cluster_name_suffix_length_default: 8
  pre_tasks:
    - name: Validate rancher group exists
      ansible.builtin.assert:
        that:
          - groups['rancher'] is defined
          - groups['rancher'] | length > 0
        fail_msg: "The 'rancher' group must exist and contain at least one host"

    - name: Validate target is set
      ansible.builtin.assert:
        that:
          - groups[target] is defined
          - groups[target] | length > 0
        fail_msg: "The 'target' variable must be defined either on all.yml or via --extra-vars and point to an inventory group with at least one node"

  tasks:
    - name: Get Rancher UserID and Token
      ansible.builtin.uri:
        url: "https://{{ fqdn }}/v3-public/localProviders/local?action=login"
        body:
          username: admin
          password: "{{ admin_password }}"
        method: POST
        force_basic_auth: true
        validate_certs: false
        status_code: 201
        body_format: json
      register: token_response
      retries: 5
      delay: 10
      until: token_response.status == 201

    - name: Get cluster name from explicit variable or environment
      ansible.builtin.set_fact:
        cluster_name: "{{ cluster_name | default(lookup('env', 'DOWNSTREAM_CLUSTER_NAME'), true) }}"

    - name: Generate cluster name as <prefix>-<random suffix> when not explicitly set
      ansible.builtin.set_fact:
        cluster_name: "{{ downstream_cluster_name_prefix | default(downstream_cluster_name_prefix_default) }}-{{ lookup('password', '/dev/null length=' ~ (downstream_cluster_name_suffix_length | default(downstream_cluster_name_suffix_length_default)) ~ ' chars=ascii_lowercase,digits') }}"
      when: cluster_name | default('', true) | length == 0

    - name: Display generated cluster name
      ansible.builtin.debug:
        msg: "Downstream cluster name: {{ cluster_name }}"

    # Register the cluster via the Rancher v3 API instead of the rancher2 Terraform/OpenTofu
    # provider. The provider's `rancher2_cluster` resource waits for the cluster to reach
    # `active`/`provisioning` on Create, but an *imported* cluster stays `pending` until the
    # cattle-cluster-agent connects — and the agent is applied later in this playbook
    # (second play, after this step returns). That ordering made the provider's create-waiter
    # retry every 10s for its 30m default timeout and never return (deadlock). The API
    # returns the cluster id and its registration token immediately, which is all this step
    # needs. This is also idempotent: it looks the cluster up by name first and only creates
    # it if absent (re-runs won't duplicate it).
    - name: Look up existing imported cluster by name (idempotency)
      ansible.builtin.uri:
        url: "https://{{ fqdn }}/v3/clusters?name={{ cluster_name }}"
        method: GET
        headers:
          Authorization: "Bearer {{ token_response.json.token }}"
        validate_certs: false
        body_format: json
        status_code: 200
      register: existing_cluster_lookup
      changed_when: false

    - name: Create imported cluster if it does not already exist
      ansible.builtin.uri:
        url: "https://{{ fqdn }}/v3/clusters"
        method: POST
        headers:
          Authorization: "Bearer {{ token_response.json.token }}"
        body_format: json
        body:
          type: cluster
          name: "{{ cluster_name }}"
          importedConfig:
            privateRegistryUrl: "{{ downstream_private_registry_url | default('') }}"
        validate_certs: false
        status_code: [200, 201]
      register: created_cluster
      when: existing_cluster_lookup.json.data | length == 0

    - name: Set cluster id fact
      ansible.builtin.set_fact:
        cluster_id: >-
          {{
            created_cluster.json.id
            if (created_cluster is not skipped)
            else existing_cluster_lookup.json.data[0].id
          }}

    - name: Fetch cluster registration token (available immediately at create time)
      ansible.builtin.uri:
        url: "https://{{ fqdn }}/v3/clusterregistrationtokens?clusterId={{ cluster_id }}"
        method: GET
        headers:
          Authorization: "Bearer {{ token_response.json.token }}"
        validate_certs: false
        body_format: json
        status_code: 200
      register: registration_token_resp
      retries: 6
      delay: 5
      until: registration_token_resp.json.data | length > 0

    - name: Set useful facts
      ansible.builtin.set_fact:
        api_key: "{{ token_response.json.token }}"
        cluster_id: "{{ cluster_id }}"
        cluster_registration_token: "{{ registration_token_resp.json.data[0].token }}"

    # Optionally inject the downstream cluster name into cattle-config.yaml.
    # Mirrors generate-admin-token.yml's rancher_auth role, which writes
    # rancher.adminToken when rancher_cattle_config_file is set.
    - name: Update cattle-config.yaml with downstream cluster name
      when: rancher_cattle_config_file | default('') | length > 0
      block:
        - name: Check if cattle config file exists
          ansible.builtin.stat:
            path: "{{ rancher_cattle_config_file }}"
          register: cattle_config_stat

        - name: Fail if cattle config file doesn't exist
          ansible.builtin.fail:
            msg: "Cattle config file not found: {{ rancher_cattle_config_file }}"
          when: not cattle_config_stat.stat.exists

        - name: Read existing cattle config
          ansible.builtin.slurp:
            src: "{{ rancher_cattle_config_file }}"
          register: cattle_config_content

        - name: Parse cattle config YAML
          ansible.builtin.set_fact:
            cattle_config: "{{ cattle_config_content.content | b64decode | from_yaml }}"

        # Opt-in, same gate as the airgap_rke2_ui_plugin_mirror role. The role ran
        # in an earlier ansible-playbook invocation (registry config or the
        # standalone mirror playbook), so its set_fact ui_plugin_mirror_url is out
        # of scope here; read the local fact it persisted on the bastion instead
        # and inject it below. This makes the stock NeuVector airgap
        # CATTLE_TEST_CONFIG work: without uiPluginChartsURL the suite falls back
        # to cloning github.com from the airgapped Rancher server, which cannot
        # succeed.
        - name: Read ui-plugin-charts mirror fact from the bastion
          when: enable_ui_plugin_mirror | default(false) | bool
          block:
            - name: Validate bastion group exists
              ansible.builtin.assert:
                that:
                  - groups['bastion'] is defined
                  - groups['bastion'] | length > 0
                fail_msg: >-
                  enable_ui_plugin_mirror is on but the 'bastion' group is empty;
                  the mirror URL cannot be read

            - name: Read the mirror local fact on the bastion
              ansible.builtin.slurp:
                src: /etc/ansible/facts.d/ui_plugin_mirror.fact
              delegate_to: "{{ groups['bastion'][0] }}"
              register: ui_plugin_mirror_fact_raw

            - name: Parse the mirror fact
              ansible.builtin.set_fact:
                ui_plugin_mirror_fact: "{{ ui_plugin_mirror_fact_raw.content | b64decode | from_json }}"

            - name: Fail when the mirror fact is missing or has no URL
              ansible.builtin.fail:
                msg: >-
                  enable_ui_plugin_mirror is on but no ui_plugin_mirror fact with a
                  'url' was found on bastion host '{{ groups['bastion'][0] }}'.
                  Run the airgap_rke2_ui_plugin_mirror role first (make ui-plugin-mirror
                  ENV=airgap, or the registry step with enable_ui_plugin_mirror=true),
                  then re-run this playbook.
              when: (ui_plugin_mirror_fact.url | default('')) | length == 0

        - name: Update cattle config with downstream cluster name
          ansible.builtin.set_fact:
            cattle_config_updated: >-
              {{ cattle_config | combine({
                'rancher': (cattle_config.rancher | default({})) | combine({
                  'clusterName': cluster_name
                })
              }, recursive=True) }}

        # Skipped unless enable_ui_plugin_mirror is on, so gate-off runs produce a
        # byte-identical cattle-config.yaml (clusterName injection only).
        - name: Inject bastion ui-plugin-charts mirror into neuvectorTest
          ansible.builtin.set_fact:
            cattle_config_updated: >-
              {{ cattle_config_updated | combine({
                'neuvectorTest': (cattle_config_updated.neuvectorTest | default({})) | combine(
                  {'uiPluginChartsURL': ui_plugin_mirror_fact.url}
                  | combine({'uiPluginChartsBranch': ui_plugin_mirror_fact.branch}
                            if (ui_plugin_mirror_fact.branch | default('') | trim | length > 0)
                            else {})
                )
              }, recursive=True) }}
          when: enable_ui_plugin_mirror | default(false) | bool

        - name: Write updated cattle config
          ansible.builtin.copy:
            content: "{{ cattle_config_updated | to_nice_yaml(indent=2) }}"
            dest: "{{ rancher_cattle_config_file }}"
            mode: '0644'

        - name: Display cattle config update status
          ansible.builtin.debug:
            msg: >-
              Updated {{ rancher_cattle_config_file }} with clusterName: {{ cluster_name }}
              {{ ('and neuvectorTest.uiPluginChartsURL: ' ~ ui_plugin_mirror_fact.url)
                 if (enable_ui_plugin_mirror | default(false) | bool) else '' }}

- hosts: bastion
  gather_facts: true
  become: true
  vars:
    downstream: "{{ target | default('', true) }}"
    fqdn: "{{ rancher_hostname | default(internal_lb_hostname) }}"
  tasks:
    - name: Read KUBECONFIG content
      block:
        - name: Try reading rke2.yaml
          ansible.builtin.slurp:
            src: "/etc/rancher/rke2/rke2.yaml"
          register: kubeconfig_content
          delegate_to: "{{ groups[downstream][0] }}"
          become: true
      rescue:
        - name: RKE2 KUBECONFIG not found, trying K3s path
          ansible.builtin.debug:
            msg: "Failed to fetch rke2.yaml. Attempting to fetch k3s.yaml"

        - name: Try reading k3s.yaml
          ansible.builtin.slurp:
            src: "/etc/rancher/k3s/k3s.yaml"
          register: kubeconfig_content
          delegate_to: "{{ groups[downstream][0] }}"
          become: true

    - name: Write kubeconfig to bastion root
      ansible.builtin.copy:
        content: "{{ kubeconfig_content.content | b64decode }}"
        dest: "/tmp/kubeconfig-{{ downstream }}.yaml"
        mode: "0600"
        owner: "{{ ansible_user }}"

    - name: Update API server address in KUBECONFIG
      ansible.builtin.replace:
        path: "/tmp/kubeconfig-{{ downstream }}.yaml"
        regexp: "https://127\\.0\\.0\\.1:6443"
        replace: 'https://{{ hostvars[groups[downstream][0]]["ansible_host"] }}:6443'


    # Airgap UI extension support: inject the bastion's ui-plugin-charts mirror
    # URL into cattle-config.yaml so the NeuVector suite creates the
    # rancher-ui-plugins ClusterRepo from the mirror instead of github.com
    # (unreachable from the airgap cluster). Mirrors the URL published by the
    # airgap_rke2_ui_plugin_mirror role.
    - name: Resolve mirror host (honor ui_plugin_mirror_host when pinned)
      # Same resolution as the airgap_rke2_ui_plugin_mirror role: pinned host
      # when set (DNS name / other interface / cross-VPC), else the bastion's
      # primary private IPv4.
      when: enable_ui_plugin_mirror | default(false) | bool
      ansible.builtin.set_fact:
        downstream_ui_plugin_mirror_host: "{{ (ui_plugin_mirror_host | default('') | trim | length > 0) | ternary(ui_plugin_mirror_host, ansible_default_ipv4.address | default(inventory_hostname)) }}"

    - name: Compute ui-plugin-charts mirror URL
      when: enable_ui_plugin_mirror | default(false) | bool
      ansible.builtin.set_fact:
        downstream_ui_plugin_mirror_url: "http://{{ downstream_ui_plugin_mirror_host }}:{{ ui_plugin_mirror_port | default(8080) }}/{{ (ui_plugin_mirror_dest | default('/srv/git/ui-plugin-charts.git')) | basename }}"

    - name: Inject ui-plugin-charts mirror URL into cattle config
      when:
        - enable_ui_plugin_mirror | default(false) | bool
        - rancher_cattle_config_file | default('') | length > 0
      delegate_to: localhost
      become: false
      block:
        - name: Read existing cattle config (mirror URL)
          ansible.builtin.slurp:
            src: "{{ rancher_cattle_config_file }}"
          register: mirror_cattle_config_content

        - name: Parse cattle config (mirror URL)
          ansible.builtin.set_fact:
            mirror_cattle_config: "{{ mirror_cattle_config_content.content | b64decode | from_yaml }}"

        - name: Merge mirror URL into neuvectorTest
          ansible.builtin.set_fact:
            mirror_cattle_config_updated: >-
              {{ mirror_cattle_config | combine({
                'neuvectorTest': (mirror_cattle_config.neuvectorTest | default({})) | combine({
                  'uiPluginChartsURL': downstream_ui_plugin_mirror_url,
                  'uiPluginChartsBranch': ui_plugin_mirror_branch | default('main')
                })
              }, recursive=True) }}

        - name: Write updated cattle config (mirror URL)
          ansible.builtin.copy:
            content: "{{ mirror_cattle_config_updated | to_nice_yaml(indent=2) }}"
            dest: "{{ rancher_cattle_config_file }}"
            mode: '0644'

        - name: Display mirror URL injection
          ansible.builtin.debug:
            msg: "Injected {{ downstream_ui_plugin_mirror_url }} (branch {{ ui_plugin_mirror_branch | default('main') }}) into {{ rancher_cattle_config_file }} as neuvectorTest.uiPluginChartsURL/uiPluginChartsBranch"

    # NOTE: no python3-pip/python3-kubernetes install here. This playbook talks
    # to the downstream apiserver exclusively via kubectl (installed on the
    # bastion by the cluster install playbook); the apt python-kubernetes
    # client is only needed by the Rancher helm-deploy playbook, which installs
    # it itself and runs before this one in the airgap-downstream flow.

    - name: Download manifest to register into Rancher
      ansible.builtin.get_url:
        url: "https://{{ fqdn }}/v3/import/{{ hostvars['localhost']['cluster_registration_token'] }}_{{ hostvars['localhost']['cluster_id'] }}.yaml"
        # Stable path (no timestamp) so re-runs overwrite in place instead of
        # littering /tmp; force refreshes the token-bearing manifest.
        dest: /tmp/cluster_registration_manifest.yaml
        mode: "0644"
        timeout: 60
        force: true
        validate_certs: false
      register: registration_manifest
      retries: 3
      delay: 10
      until: registration_manifest is success

    - name: Apply manifest to add cluster to Rancher
      # kubectl, not kubernetes.core.k8s: the apt python-kubernetes client sets
      # no per-request timeout, so a stalled connection to the downstream
      # apiserver wedges the module forever (same reason the rollout wait below
      # uses kubectl). kubectl bounds every request via --request-timeout; the
      # kubeconfig embeds the cluster CA, so TLS verification works as-is.
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig=/tmp/kubeconfig-{{ downstream }}.yaml
          - --request-timeout=30s
          - apply
          - -f
          - /tmp/cluster_registration_manifest.yaml
      register: manifest_apply
      changed_when: manifest_apply.stdout is not search('unchanged')
      retries: 3
      delay: 10
      until: manifest_apply.rc == 0

    - name: Point the cluster agent at the internal LB and relax strict verify (airgap)
      # server-url is deliberately the PUBLIC hostname (issue #198: kubeconfigs
      # consumed by external runners must not reference the internal LB). The
      # stock agent therefore bootstraps and tunnels against the public name,
      # which unroutable-or-broken from inside the airgap VPC (wss sessions via
      # the public name die with websocket 1006 even when routed to the internal
      # LB). The PROVEN working configuration: bootstrap AND remotedialer tunnel
      # on the internal LB name, with STRICT_VERIFY=false so the agent does not
      # re-test the server-advertised (public) URL. Verified live: cluster goes
      # active with exactly this env pair.
      when: internal_lb_hostname is defined
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig=/tmp/kubeconfig-{{ downstream }}.yaml
          - --request-timeout=30s
          - --namespace=cattle-system
          - set
          - env
          - deployment/cattle-cluster-agent
          - CATTLE_SERVER=https://{{ internal_lb_hostname }}
          - STRICT_VERIFY=false
      register: agent_env_override
      changed_when: false
      retries: 3
      delay: 10
      until: agent_env_override.rc == 0

    - name: Make the public Rancher hostname resolve inside the cluster (airgap)
      # server-url is deliberately the PUBLIC hostname (issue #198: kubeconfigs
      # consumed by external runners must not reference the internal LB).
      # Cluster pods resolve the public name via VPC DNS to the internet-facing
      # LB, which is unroutable from inside the airgap VPC. This hosts override
      # points the public name at the internal LB in cluster DNS so plain HTTP
      # paths via the public name work in-cluster (agent bootstrap before the
      # env override above, and best-effort for other server-url-derived
      # consumers such as fleet). NOTE: it does NOT make the agent's wss tunnel
      # work via the public name — those sessions die with websocket 1006
      # behind the NLB/ingress (observed live); that is why the env override
      # above keeps the agent itself on the internal name.
      when: internal_lb_hostname is defined
      block:
        - name: Resolve the internal LB address
          ansible.builtin.command: getent hosts {{ internal_lb_hostname }}
          register: internal_lb_addr
          changed_when: false

        - name: Read the cluster DNS Corefile
          ansible.builtin.command:
            argv:
              - kubectl
              - --kubeconfig=/tmp/kubeconfig-{{ downstream }}.yaml
              - --request-timeout=30s
              - --namespace=kube-system
              - get
              - configmap
              - rke2-coredns-rke2-coredns
              - -o
              - jsonpath={.data.Corefile}
          register: coredns_corefile
          changed_when: false

        - name: Insert hosts override for the public Rancher hostname
          # Idempotent: skipped when the override is already in the Corefile.
          when: not (coredns_corefile.stdout is search(fqdn))
          ansible.builtin.shell: |
            set -e
            IP={{ internal_lb_addr.stdout.split()[0] }}
            printf '%s\n' '{{ coredns_corefile.stdout }}' \
              | sed "s|    forward  . /etc/resolv.conf|    hosts {\n        ${IP} {{ fqdn }}\n        fallthrough\n    }\n    forward  . /etc/resolv.conf|" \
              > /tmp/corefile.new
            grep -q '{{ fqdn }}' /tmp/corefile.new
            kubectl --kubeconfig=/tmp/kubeconfig-{{ downstream }}.yaml --request-timeout=30s --namespace=kube-system \
              create configmap rke2-coredns-rke2-coredns --from-file=Corefile=/tmp/corefile.new --dry-run=client -o yaml \
              | kubectl --kubeconfig=/tmp/kubeconfig-{{ downstream }}.yaml apply -f -
            kubectl --kubeconfig=/tmp/kubeconfig-{{ downstream }}.yaml --request-timeout=30s --namespace=kube-system \
              rollout restart deployment/rke2-coredns-rke2-coredns
            kubectl --kubeconfig=/tmp/kubeconfig-{{ downstream }}.yaml --request-timeout=30s --namespace=kube-system \
              rollout status deployment/rke2-coredns-rke2-coredns --timeout=180s
          args:
            executable: /bin/bash

    - name: Wait for agent deployment to be ready
      block:
        - name: Wait for cattle-cluster-agent Deployment to be Available
          # kubectl, not k8s_info: the apt python-kubernetes client sets no
          # per-request timeout, so a stalled connection to the downstream
          # apiserver wedges the module forever (wait_timeout only applies
          # between polls). kubectl bounds every request via --request-timeout.
          ansible.builtin.command:
            argv:
              - kubectl
              - --kubeconfig=/tmp/kubeconfig-{{ downstream }}.yaml
              - --request-timeout=30s
              - --namespace=cattle-system
              - rollout
              - status
              - deployment/cattle-cluster-agent
              - --timeout=600s
          changed_when: false
      rescue:
        - name: Dump cattle-system deployment, pods, and events
          ansible.builtin.command:
            argv:
              - kubectl
              - --kubeconfig=/tmp/kubeconfig-{{ downstream }}.yaml
              - --request-timeout=30s
              - --namespace=cattle-system
              - get
              - deploy,pods,events
              - -o
              - wide
          changed_when: false
          failed_when: false

        - name: Describe the agent pod for image-pull or crash details
          # Shell is required to pipe the pod name from get into describe.
          ansible.builtin.shell: |
            kubectl --kubeconfig=/tmp/kubeconfig-{{ downstream }}.yaml --request-timeout=30s -n cattle-system \
              get pod -l app=cattle-cluster-agent -o name | head -1 | xargs -r -I{} \
              kubectl --kubeconfig=/tmp/kubeconfig-{{ downstream }}.yaml --request-timeout=30s -n cattle-system describe {}
          changed_when: false
          failed_when: false

        - name: Fail with a pointer to the diagnostics above
          ansible.builtin.fail:
            msg: >-
              cattle-cluster-agent did not become Available within 600s on the
              downstream cluster. See the deployment/pod/events output above for the
              cause (typical: agent image pull through the private registry, or the
              agent cannot reach https://{{ fqdn }} from the downstream nodes).

    - name: Check if imported cluster is ready
      ansible.builtin.uri:
        url: "https://{{ fqdn }}/v3/clusters/{{ hostvars['localhost']['cluster_id'] }}"
        method: GET
        headers:
          Authorization: "Bearer {{ hostvars['localhost']['api_key'] }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
        body_format: json
      register: cluster_check
      retries: 5
      delay: 30
      until: cluster_check.status == 200 and cluster_check.json.state == "active"
