[defaults]
inventory = inventory/inventory.yml
remote_user = ec2-user
host_key_checking = False
stdout_callback = ansible.builtin.default
result_format = yaml
roles_path = ../../roles

[ssh_connection]
# Keepalives keep the controller<->bastion channel from being silently reaped
# by stateful middleboxes during long tasks, and detect a dead channel within
# ~5 minutes instead of blocking until an external timeout fires.
# Multiplexing reuses one controller->bastion->node connection per host
# instead of one per task; per-task channels occasionally die in banner
# exchange under connection churn (observed on long airgap runs).
ssh_args = -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o ControlMaster=auto -o ControlPath=/tmp/ansible-ssh-%h-%p-%r -o ControlPersist=120s
pipelining = True
