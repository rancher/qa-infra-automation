# rke2 version and installation settings
kubernetes_version: 'v1.36.2+rke2r1'

# kubeconfig file
kubeconfig_file: './kubeconfig.yaml'

# cni configuration
cni: "calico"

# node token file for cluster communication
node_token_file: "/tmp/node_token.txt"

# Override rke2_agent_config to correctly bracket the IPv6 address for the join URL
rke2_agent_config:
  server: "https://[{{ kube_api_host }}]:9345"

# Server configuration flags (applied to server/control-plane nodes)
# See https://docs.rke2.io/reference/server_config for all options
server_flags: |
  ingress-controller: traefik
  cluster-cidr: 2001:cafe:42:0::/56,10.42.0.0/16
  service-cidr: 2001:cafe:43:0::/112,10.43.0.0/16
  node-ip: "{{ ansible_host_ipv6 }},{{ ansible_host }}"

# Agent configuration flags (applied to agent/worker nodes)
# See https://docs.rke2.io/reference/linux_agent_config for all options
agent_flags: |
  node-ip: "{{ ansible_host_ipv6 }},{{ ansible_host }}"