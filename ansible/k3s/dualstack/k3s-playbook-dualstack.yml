---
# K3s dual-stack (IPv4 + IPv6) cluster. Mirrors ansible/k3s/default/k3s-playbook.yml,
# but keeps the inventory's bastion ProxyCommand and never targets the bastion host.
- name: Resolve dual-stack cluster endpoints
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files: [vars.yaml]
  vars:
    _cp_hosts: >-
      {{ groups['all'] | default([]) | map('extract', hostvars)
         | selectattr('node_roles', 'defined')
         | selectattr('node_roles', 'contains', 'cp')
         | map(attribute='inventory_hostname') | list }}
  tasks:
    - name: Require master and cp hosts in the inventory
      ansible.builtin.assert:
        that:
          - (groups['master'] | default([])) | length > 0
          - _cp_hosts | length > 0
        fail_msg: >-
          Inventory needs a 'master' group and at least one host with the 'cp'
          role. Regenerate it with 'make infra-up DISTRO=k3s ENV=dualstack' or start from
          inventory/inventory.yml.template.

    # Joining servers and agents bootstrap through kube_api_host, so it defaults to the cluster-init node.
    - name: Resolve kube_api_host and fqdn
      ansible.builtin.set_fact:
        kube_api_host: >-
          {{ lookup('env', 'KUBE_API_HOST')
             | default(kube_api_host | default(''), true)
             | default(hostvars[groups['master'][0]].ansible_host, true) }}
        fqdn: "{{ lookup('env', 'FQDN') | default(fqdn | default(''), true) }}"
        # Split-role master may be etcd-only and have no apiserver.
        apiserver_inventory_host: "{{ _cp_hosts | first }}"
        kube_api_apiserver_host: "{{ hostvars[_cp_hosts | first].ansible_host }}"

    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - kubernetes_version is defined
          - kubernetes_version | length > 0
          - kube_api_host | length > 0
        fail_msg: "Required variables not defined. Set kubernetes_version in vars.yaml and kube_api_host in the inventory, vars.yaml or KUBE_API_HOST"

- name: Prepare nodes
  hosts: all:!bastion
  become: true
  gather_facts: false
  vars_files: [vars.yaml]
  pre_tasks:
    - name: Wait for SSH to become available
      ansible.builtin.wait_for_connection:
        delay: 10
        timeout: 300
      become: false
    - name: Use the endpoints resolved on localhost
      ansible.builtin.set_fact:
        kube_api_host: "{{ hostvars['localhost'].kube_api_host }}"
        fqdn: "{{ hostvars['localhost'].fqdn }}"
    - name: Prepare node
      ansible.builtin.include_role:
        name: setup
    - name: Gather facts
      ansible.builtin.setup:

- name: Install K3s on the cluster-init node
  hosts: master
  become: true
  gather_facts: false
  vars_files: [vars.yaml]
  vars:
    # Test hosts: keep SL Micro's transactional-update.timer off for the whole run; a catch-up
    # trigger mid-run holds the lock that zypper needs. BYO: -e suse_disable_update_timer=false
    suse_disable_update_timer: true
    node_token_file: "/tmp/node_token.txt"
  pre_tasks:
    # Static import so the role's tasks inherit 'always' and survive --tags setup/install.
    - name: Keep the SUSE update timer off for the run
      ansible.builtin.import_role:
        name: suse_update_timer
      tags: ['always']
  tasks:
    - name: Create K3s server manifests directory on master
      ansible.builtin.file:
        path: /var/lib/rancher/k3s/server/manifests
        state: directory
        mode: '0700'

    - name: Apply K3s hardening on initial cluster node if enabled
      ansible.builtin.include_role:
        name: k3s_hardening
      vars:
        k3s_node_type: cluster-init
        role_server_flags: "{{ server_flags | default('') }}"

    - name: Install K3s on initial cluster node
      ansible.builtin.include_role:
        name: k3s_install
      vars:
        k3s_node_type: cluster-init
        k3s_api_host: "{{ kube_api_host }}"
        k3s_fqdn: "{{ fqdn | default(kube_api_host, true) }}"
        public_ip: "{{ ansible_host }}"
        role_server_flags: "{{ server_flags | default('') }}"
        k3s_channel: "{{ channel | default('latest') }}"

    - name: Get node-token from master
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: node_token_output

    - name: Save node_token to local file
      ansible.builtin.copy:
        content: "{{ node_token_output.content | b64decode }}"
        dest: "{{ node_token_file }}"
        mode: '0600'
      delegate_to: localhost
      run_once: true
      become: false

    - name: Read kubeconfig file contents
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: kubeconfig_contents

    - name: Save kubeconfig locally
      ansible.builtin.copy:
        content: "{{ kubeconfig_contents.content | b64decode }}"
        dest: "{{ playbook_dir }}/kubeconfig.yaml"
        mode: '0600'
      delegate_to: localhost
      run_once: true
      become: false

    # Not the fqdn: with kube_api_host_ipv6 it is AAAA-only, unreachable from IPv4-only
    # controllers. Use the cp node's ansible_host (public IPv4), as rke2 dualstack does.
    - name: Update kubeconfig server address
      ansible.builtin.lineinfile:
        path: "{{ playbook_dir }}/kubeconfig.yaml"
        regexp: '^\s*server:\s+https://[^\s]+'
        line: "    server: https://{{ ('[' ~ _host ~ ']') if ':' in _host else _host }}:6443"
      vars:
        _host: "{{ hostvars['localhost'].kube_api_apiserver_host }}"
      delegate_to: localhost
      run_once: true
      become: false

- name: Join K3s servers and agents
  hosts: all:!bastion
  become: true
  gather_facts: false
  strategy: free
  vars_files: [vars.yaml]
  vars:
    suse_disable_update_timer: true
    node_token_file: "/tmp/node_token.txt"
    _is_master: "{{ inventory_hostname in groups.get('master', []) }}"
    _is_server: "{{ inventory_hostname in groups.get('servers', []) }}"
    _is_agent: "{{ inventory_hostname in groups.get('workers', []) }}"
  pre_tasks:
    - name: Keep the SUSE update timer off for the run
      ansible.builtin.import_role:
        name: suse_update_timer
      tags: ['always']
  tasks:
    - name: Read node_token from local file
      ansible.builtin.slurp:
        src: "{{ node_token_file }}"
      delegate_to: localhost
      become: false
      register: node_token_file_content
      no_log: true

    - name: Set node_token fact from file content
      ansible.builtin.set_fact:
        node_token: "{{ node_token_file_content.content | b64decode | trim }}"
      no_log: true

    - name: Create K3s server manifests directory on server nodes
      ansible.builtin.file:
        path: /var/lib/rancher/k3s/server/manifests
        state: directory
        mode: '0700'
      when: _is_server and not _is_master

    - name: Apply K3s hardening on server nodes if enabled (before installation)
      ansible.builtin.include_role:
        name: k3s_hardening
      vars:
        k3s_node_type: server
        role_server_flags: "{{ server_flags | default('') }}"
      when: _is_server and not _is_master

    - name: Install K3s on server nodes
      ansible.builtin.include_role:
        name: k3s_install
      vars:
        k3s_node_type: server
        k3s_api_host: "{{ kube_api_host }}"
        k3s_fqdn: "{{ fqdn | default(kube_api_host, true) }}"
        k3s_token: "{{ node_token }}"
        public_ip: "{{ ansible_host }}"
        role_server_flags: "{{ server_flags | default('') }}"
        k3s_channel: "{{ channel | default('latest') }}"
      when: _is_server and not _is_master

    - name: Apply K3s hardening on agent nodes if enabled
      ansible.builtin.include_role:
        name: k3s_hardening
      vars:
        k3s_node_type: agent
        role_server_flags: "{{ server_flags | default('') }}"
        role_worker_flags: "{{ worker_flags | default('') }}"
      when: _is_agent and not _is_master

    - name: Install K3s on agent nodes
      ansible.builtin.include_role:
        name: k3s_install
      vars:
        k3s_node_type: agent
        k3s_api_host: "{{ kube_api_host }}"
        k3s_fqdn: "{{ fqdn | default(kube_api_host, true) }}"
        k3s_token: "{{ node_token }}"
        public_ip: "{{ ansible_host }}"
        k3s_worker_flags: "{{ worker_flags | default('') }}"
        k3s_channel: "{{ channel | default('latest') }}"
      when: _is_agent and not _is_master

# Checked on a cp node: behind a bastion the control host may not reach the API.
- name: Check K3s cluster health
  hosts: all:!bastion
  become: true
  gather_facts: false
  tasks:
    - name: Wait until all K3s system pods are Running or Succeeded
      ansible.builtin.command: k3s kubectl --server https://localhost:6443 get pods -n kube-system -o json
      register: k3s_pods_check
      changed_when: false
      when: inventory_hostname == hostvars['localhost'].apiserver_inventory_host
      until: >-
        k3s_pods_check.rc == 0 and
        ((k3s_pods_check.stdout | from_json)['items']
          | rejectattr('status.phase', 'in', ['Running', 'Succeeded']) | list | length == 0)
      retries: 10
      delay: 30

- name: Prepare bastion node
  hosts: bastion
  become: true
  gather_facts: true
  roles:
    - role: bastion_prepare

- name: Copy kubeconfig to bastion node
  hosts: bastion
  become: false
  gather_facts: false
  tasks:
    - name: Ensure .kube directory exists
      ansible.builtin.file:
        path: "~/.kube"
        state: directory
        mode: '0700'

    - name: Copy kubeconfig to bastion
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/kubeconfig.yaml"
        dest: "~/.kube/config"
        mode: '0600'
